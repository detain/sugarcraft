name: VHS runner PHP image

on:
  push:
    branches: [master]
    paths:
      - 'scripts/Dockerfile.vhs-runner'
      - '.github/workflows/vhs-runner-php-image.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE_NAME: ghcr.io/detain/sugarcraft-vhs-runner-php

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b4ffde65f46336ab88af53be14092a9328e9c503

      - uses: docker/setup-buildx-action@4cb21933a4c186b7d5a7e5b4a3f9c4b5e6d7c8a9b

      - name: Log in to GHCR
        uses: docker/login-action@343f7c4344506c9f87b4e0a5b5d7c8e9f0a1b2c3d
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@5a5d531219b428d4c4e2e2c4f4a5e5c4c4e4e4e4e
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build + push image
        uses: docker/build-push-action@4d1f9c7a6e8d9f0a1b2c3d4e5f6a7b8c9d0e1f2a
        with:
          context: .
          file: scripts/Dockerfile.vhs-runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## VHS runner PHP image built"
            echo ""
            echo "- Image: \`${{ env.IMAGE_NAME }}:latest\`"
            echo "- SHA: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
