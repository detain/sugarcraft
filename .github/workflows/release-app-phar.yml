# Build and publish versioned PHARs for every phar-capable app EXCEPT the
# two that already own dedicated pipelines (candy-code → release-phar.yml,
# candy-top → release-candy-top-phar.yml; both are proven and stay untouched
# — this file's scope guard exits green with a notice when one of their tags
# arrives, so a `candy-code/v*` push can never double-publish here).
#
# Triggered by pushing a tag spelled `<app>/v*` for any other candy-* app
# (per-lib tagging on the shared repo stream), or manually with a tag input.
#
# RELEASE POSTURE (OD-5/OD-7/OD-8, reviews-1103 G6-P): nothing publishes on
# untested bytes. The gate job resolves the tag to its commit, refuses a tag
# that is not an ancestor-or-self of master, and refuses to proceed until the
# CI workflow run AT THAT EXACT COMMIT is green (bounded poll, fail-closed on
# absence, red, or timeout). The release job checks the explicit commit out
# and passes only the tagged SHA (never a branch name) as the release
# target_commitish. Provenance rides with the artifact as release assets:
# <app>.phar.commit (the full build SHA) and <app>.phar.pins.json (the
# resolved sibling pin map). Two releases of the SAME app serialize on the
# release job's per-app concurrency group; different apps proceed freely.
#
# REPRODUCIBILITY (OD-14 pinning half): the lock stays absent by house rule,
# but sugarcraft/* siblings no longer float on Packagist dev-master —
# scripts/pin-siblings.php injects TRANSIENT symlink:false path repositories
# over the tested checkout for the whole transitive require closure before
# composer install, and the verify mode aborts if any locked sibling still
# resolves from the network. The injection exists only inside this runner;
# committed manifests keep bare @dev requires (tools/check-path-repos.php
# --no-lib-path-repos stays green, pinned by tools/tests). The build script
# still REFUSES symlinked sibling vendors, dirty source trees, and detached
# HEADs; the checkout below attaches the explicit commit to a named branch
# because the preflight demands exactly that attribution.
#
# `phar.readonly=0` is passed with `-d` to the BUILD command only. It is
# never a runtime requirement: the produced archive executes under a normal
# `php <app>.phar` with the default readonly=On.
#
# The signing step reads the sugarcraft-WIDE secret SUGARCRAFT_SIGNING_KEY
# (owner ruling 2026-10-21: one keypair signs every app's phar; each app pins
# the public half in its own source). It signs the .sha256 sidecar body into
# <app>.phar.sha256.sig and keeps emitting the legacy raw-byte .minisig
# additively (C-SES-5.c). Absent the secret, the build ships UNSIGNED;
# nothing else changes.
name: Release app PHARs

on:
  push:
    tags:
      - 'candy-*/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing <app>/v* tag to build and publish'
        required: true

permissions:
  contents: write

# G6-P OD-5: same-tag races are impossible (belt; the per-app lock lives on
# the release job's concurrency). cancel-in-progress false: a running release
# is finished, not cancelled by its successor.
concurrency:
  group: release-app-phar-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # ci.yml's rationale: the detached checkout versions each lib as
  # dev-<sha>; circular sibling back-requires on dev-master then fail
  # install unless the root version is pinned.
  COMPOSER_ROOT_VERSION: dev-master

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    outputs:
      app: ${{ steps.scope.outputs.app }}
      tag: ${{ steps.scope.outputs.tag }}
      tag_sha: ${{ steps.ancestry.outputs.tag_sha }}
      proceed: ${{ steps.scope.outputs.proceed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Resolve app and guard the dedicated pipelines
        id: scope
        # C-SES-9.d: the dispatched tag is attacker-influenceable text; it
        # crosses into the shell only through this step's `env:`, never as a
        # `${{ }}` paste into the script body.
        run: |
          set -euo pipefail
          if [ "$EVENT" = 'workflow_dispatch' ]; then
            tag="$TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s' "$tag" | grep -qE '^candy-[a-z0-9-]+/v'; then
            echo "tag '$tag' does not have the <app>/v* shape this workflow builds" >&2
            exit 1
          fi
          app="${tag%%/*}"
          if [ "$app" = 'candy-code' ] || [ "$app" = 'candy-top' ]; then
            echo "::notice::$app is owned by its dedicated phar pipeline — skipping to avoid double-publish"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$app" = 'candy-starter' ] \
             || [ "$(php -r '$j = json_decode(file_get_contents($argv[1]), true); echo $j["type"] ?? "";' "$app/composer.json" 2>/dev/null || true)" = 'project' ]; then
            # CS-02 (candy-starter-002): a create-project template is not a
            # phar — its release vehicle is the tagged dist Composer itself
            # downloads. Before this skip existed, minting the first
            # candy-starter/v* tag was guaranteed to detonate the build-phar
            # door below (a template has no tools/build-phar.php BY DESIGN),
            # which is exactly why no tag ever shipped. type:project answers
            # green for every template-shaped package; the name arm keeps the
            # intent explicit for the fleet's flagship skeleton.
            echo "::notice::$app is a create-project template (composer type: project) — it releases via tagged dist, not phar; skipping green"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "$app/tools/build-phar.php" ]; then
            # A version tag on an app without build plumbing is a mistake
            # worth a red X: silently skipping would let release intent rot
            # unnoticed. Add <app>/tools/build-phar.php or retag.
            echo "tag '$tag' names '$app', but $app/tools/build-phar.php does not exist — this app is not plumbed for phar releases" >&2
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.inputs.tag }}

      - name: Tag-ancestry door (OD-5)
        id: ancestry
        if: steps.scope.outputs.proceed == 'true'
        # A <app>/v* tag that is not an ancestor-or-self of master is orphaned
        # intent — the release would ship bytes no CI leg ever covered on the
        # mainline. The SHA lands in this job's outputs so every later step
        # addresses the explicit commit, never a branch.
        run: |
          set -euo pipefail
          tag="$TAG"
          tag_sha="$(git rev-parse "$tag^{commit}")"
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$tag_sha" origin/master; then
            echo "refusing release of $APP $tag ($tag_sha): not an ancestor-or-self of master" >&2
            exit 1
          fi
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "gating $APP release of $tag at $tag_sha"
        env:
          APP: ${{ steps.scope.outputs.app }}
          TAG: ${{ steps.scope.outputs.tag }}

      - name: CI-green door (OD-7)
        if: steps.scope.outputs.proceed == 'true'
        # Bounded poll for the CI workflow run AT THE TAGGED COMMIT — green
        # only. Fail-closed on every non-green shape: a completed red run is
        # fatal immediately, a missing or still-running CI is retried until
        # the attempt budget burns out and REFUSES the release. Tag pushes
        # trigger no CI leg of their own, so the wait is the normal case.
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            run_line="$(gh run list --workflow CI --branch master --commit "$TAG_SHA" \
              --limit 5 --json status,conclusion \
              --jq '[.[] | select(.status == "completed")] | if length == 0 then "PENDING" else (first(.[]) | .conclusion) end')"
            if [ "$run_line" = 'success' ]; then
              echo "CI is green at $TAG_SHA — releasing"
              exit 0
            fi
            case "$run_line" in
              PENDING)
                echo "CI at $TAG_SHA not concluded yet (attempt $attempt/240)"
                ;;
              *)
                echo "refusing release: CI at $TAG_SHA concluded '$run_line'" >&2
                exit 1
                ;;
            esac
            sleep 60
          done
          echo "refusing release: no green CI at $TAG_SHA within the poll budget (fail-closed)" >&2
          exit 1
        env:
          TAG_SHA: ${{ steps.ancestry.outputs.tag_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # G6-P OD-5: per-app concurrency lock — two releases of the SAME app
    # serialize here; releases of different apps never share this group and
    # proceed in parallel.
    concurrency:
      group: release-app-phar-${{ needs.gate.outputs.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # G6-P OD-8: build-at-SHA — the explicit tested commit, never a
          # branch or tag name, comes from the gate's ancestry resolution.
          ref: ${{ needs.gate.outputs.tag_sha }}
          fetch-depth: 0

      - name: Attach HEAD to the tag
        # The build's integrity preflight refuses detached HEADs (a tag
        # checkout IS detached); re-attaching the same commit to a branch
        # name keeps the artifact attributable without weakening the door.
        run: |
          set -euo pipefail
          git checkout -B phar-build "$TAG"
        env:
          TAG: ${{ needs.gate.outputs.tag }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          coverage: none
          # The full ci.yml extension union: this job serves an open-ended
          # fleet of apps, so every extension any of them may
          # composer-resolve has to be present.
          extensions: mbstring, intl, json, pcntl, sqlite3, pdo_sqlite, pdo_mysql, pdo_pgsql, ssh2, gd, curl, openssl, ffi

      - name: Pin sibling deps to the tested commit (OD-14)
        # Transient injection of symlink:false path repositories over this
        # checkout for the full transitive sugarcraft/* closure, so the
        # artifact is provably built from the SAME bytes the CI run covered
        # — the Packagist dev-master float is closed for releases. The
        # injection edits only the app manifest INSIDE THIS RUNNER; the
        # committed tree never carries it (path-repos inverse policy, pinned
        # by tools/tests). verify mode below re-proves nothing floated.
        # WF-CURE (#60/#68 lineage): the sidecar is born OUTSIDE the worktree
        # via --out — a repo-root relocation would itself be an untracked path
        # in build-phar Guard 2's repo-wide porcelain.
        run: |
          set -euo pipefail
          php scripts/pin-siblings.php inject "$APP" --root . --sha "$TAG_SHA" --ref "$TAG" \
            --out "${RUNNER_TEMP:-/tmp}/pins-$APP.json"
        env:
          APP: ${{ needs.gate.outputs.app }}
          TAG_SHA: ${{ needs.gate.outputs.tag_sha }}
          TAG: ${{ needs.gate.outputs.tag }}

      - name: Install production dependencies
        run: |
          set -euo pipefail
          cd "$APP"
          rm -f composer.lock
          composer install --no-dev --prefer-dist --no-interaction --no-progress
        env:
          APP: ${{ needs.gate.outputs.app }}

      - name: Verify no sibling floated to the network (OD-14)
        # Fail-closed float detector over the resolved lock: every locked
        # sugarcraft/* package must carry a path dist. If Packagist ever
        # wins a resolution race, the release stops HERE, not in the notes.
        run: |
          set -euo pipefail
          php scripts/pin-siblings.php verify "$APP"
          # WF-CURE: no sidecar mv here — inject already parked it outside
          # the worktree (--out, RUNNER_TEMP); verify reads only the lock.
        env:
          APP: ${{ needs.gate.outputs.app }}

      - name: Restore app manifest + prove Guard 2 preconditions (WF-CURE)
        # OD-14's inject rewrites the tracked $APP/composer.json, and build-phar
        # Guard 2's porcelain is REPO-WIDE (`git -C $APP status --porcelain`
        # reports every path of the monorepo), so the injected manifest froze
        # the release train from 2026-11-04 on. The injection has done its job
        # by now — vendor holds the pinned bytes and build-phar reads
        # vendor/composer/installed.json, never the manifest — so restore it,
        # then prove Guard 2's exact precondition at the seat: the tripwire
        # runs the same repo-wide porcelain, so a red names the lingering path
        # here instead of a bare exit 2 from inside the build. The heavy arm
        # near the end re-injects for its dev install. The guard itself stays
        # untouched (ceiling-silence law).
        run: |
          set -euo pipefail
          git checkout -- "$APP/composer.json"
          dirty="$(git -C "$APP" status --porcelain)"
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty"
            echo "::error::tree still dirty for Guard 2 after manifest restore (repo-wide porcelain via -C $APP)"
            exit 1
          fi
        env:
          APP: ${{ needs.gate.outputs.app }}

      - name: Build the archive
        run: |
          set -euo pipefail
          app="$APP"
          # SOURCE_DATE_EPOCH pins metadata['built_at'] to the tagged
          # commit's date so rebuilds of one tag agree on the stamp
          # (DST-1's discipline); the dependency window no longer moves —
          # siblings ride the injected pins of this exact commit (OD-14).
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%cT "$TAG")"
          php -d phar.readonly=0 "$app/tools/build-phar.php" \
            --out="dist/$app.phar" \
            --version="$TAG"
        env:
          APP: ${{ needs.gate.outputs.app }}
          TAG: ${{ needs.gate.outputs.tag }}

      - name: Assert the archive carries the tagged stamp
        # The DST-1 release-shape proof, generalized: the manifest metadata
        # (what --version reads back via Version::fromPharMetadata) must be
        # the tag, never the frozen vendor's dev-master. Asserted on the
        # artifact itself so apps whose CLI does not echo the stamp are
        # still verified.
        run: |
          set -euo pipefail
          php -r '
            $phar = getenv("PHAR_PATH");
            $want = getenv("WANT_STAMP");
            $meta = (new Phar($phar))->getMetadata();
            $got = is_array($meta) ? ($meta["version"] ?? null) : null;
            if ($got !== $want) {
              fwrite(STDERR, "release stamp mismatch: metadata has " . var_export($got, true) . ", expected " . $want . "\n");
              exit(1);
            }
          '
        env:
          PHAR_PATH: ${{ github.workspace }}/dist/${{ needs.gate.outputs.app }}.phar
          WANT_STAMP: ${{ needs.gate.outputs.tag }}

      - name: Provenance sidecars (OD-8)
        # The shipped artifact stays traceable to its tested SHA without
        # touching build-phar or app source: <app>.phar.commit carries the
        # full build commit, <app>.phar.pins.json the sibling pin map the
        # verify step confirmed. Both publish as release assets below.
        run: |
          set -euo pipefail
          app="$APP"
          printf '%s\n' "$TAG_SHA" > "dist/$app.phar.commit"
          mv "${RUNNER_TEMP:-/tmp}/pins-$APP.json" "dist/$app.phar.pins.json"
          test -s "dist/$app.phar.pins.json"
          cat "dist/$app.phar.commit"
        env:
          APP: ${{ needs.gate.outputs.app }}
          TAG_SHA: ${{ needs.gate.outputs.tag_sha }}

      - name: Checksum
        # C-SES-5.c: runs BEFORE signing on purpose — the signing step's
        # headline artifact is a signature over this sidecar's body, so the
        # sidecar has to exist first. The .sha256 names the bytes this job
        # built (integrity); the trust leg is the signature below.
        run: |
          set -euo pipefail
          app="$APP"
          (cd dist && sha256sum "$app.phar" > "$app.phar.sha256")
          cat "dist/$app.phar.sha256"
        env:
          APP: ${{ needs.gate.outputs.app }}

      - name: Sign the archive (pinned-key mode)
        # OPTIONAL by design (identical semantics to the reference pipeline):
        # without SUGARCRAFT_SIGNING_KEY the step skips green and the release
        # ships unsigned. When the owner populates the sugarcraft-wide secret
        # (one keypair signs every app's phar; each app pins the public half
        # in its own source), this emits — all legs verified against the key
        # pinned in source, never against anything the release channel
        # controls:
        #   - $app.phar.sha256.sig: a base64 detached sodium signature over
        #     the .sha256 SIDECAR BODY (a few bytes, never the whole archive);
        #     the leg current candy-code-style `self-update` verifies
        #     (C-SES-5.b) before trusting the sidecar to gate a swap.
        #   - $app.phar.minisig: the legacy raw-byte signature, kept
        #     additively for candy-top and older clients.
        #   - $app.phar.minisig.sha256: computed here, not in the (now
        #     earlier) checksum step, since it can only exist after its file.
        # In keyless state all three are skipped together: one early-exit
        # step, and the publish gate below sees no signature files.
        run: |
          set -euo pipefail
          app="$APP"
          if [ -z "${SUGARCRAFT_SIGNING_KEY:-}" ]; then
            echo "::notice::SUGARCRAFT_SIGNING_KEY secret not set — shipping unsigned (keyless state)"
            exit 0
          fi
          php -r '
            $app = getenv("APP");
            $key = base64_decode(getenv("SUGARCRAFT_SIGNING_KEY"), true);
            if ($key === false || strlen($key) !== SODIUM_CRYPTO_SIGN_SECRETKEYBYTES) {
              fwrite(STDERR, "SUGARCRAFT_SIGNING_KEY must be the base64 of the 64-byte sodium secret key\n");
              exit(1);
            }
            $sig = sodium_crypto_sign_detached(file_get_contents("dist/$app.phar"), $key);
            file_put_contents("dist/$app.phar.minisig", base64_encode($sig) . "\n");
            $sidecar_sig = sodium_crypto_sign_detached(file_get_contents("dist/$app.phar.sha256"), $key);
            file_put_contents("dist/$app.phar.sha256.sig", base64_encode($sidecar_sig) . "\n");
          '
          (cd dist && sha256sum "$app.phar.minisig" > "$app.phar.minisig.sha256")
        env:
          APP: ${{ needs.gate.outputs.app }}
          SUGARCRAFT_SIGNING_KEY: ${{ secrets.SUGARCRAFT_SIGNING_KEY }}

      - name: Smoke — version and help on a virgin HOME
        # App-agnostic shape (the reference pipelines' candy-code-specific
        # headless-echo arm deliberately does NOT live here): every candy-*
        # app must answer --version and render --help with no config, no
        # data dir, and no controlling terminal. The stamp assertion above
        # already proved the tagged version is the artifact's own; a CLI
        # that has not wired the metadata read-back earns a notice, not a
        # silent pass.
        run: |
          set -euo pipefail
          app="$APP"
          tag="$TAG"
          fake_home="$(mktemp -d)"
          out="$(HOME="$fake_home" php "dist/$app.phar" --version)"
          test -n "$out"
          echo "--version says: $out"
          if ! printf '%s' "$out" | grep -qF "${tag#"$app"/}"; then
            echo "::notice::$app --version does not surface the tagged stamp (archive metadata still carries $tag)"
          fi
          HOME="$fake_home" php "dist/$app.phar" --help >/dev/null
        env:
          APP: ${{ needs.gate.outputs.app }}
          TAG: ${{ needs.gate.outputs.tag }}

      - name: PharCompatTest heavy arm (apps that have one)
        # Generalized from the reference pipelines: only apps that actually
        # ship a PharCompatTest run their CANDY_<APP>_PHAR-gated stage 4
        # against the fresh archive — file-existence gate, never a
        # hardcoded roster. Dev dependencies install only here; the
        # artifact above was built from the --no-dev vendor, and re-running
        # install does not touch dist/.
        # WF-CURE: the manifest was restored before the build, so re-inject
        # the same closure (throwaway sidecar under RUNNER_TEMP) first — this
        # dev install must resolve siblings from the tested bytes, never from
        # the Packagist dev-master float that OD-14 closed for releases.
        run: |
          set -euo pipefail
          app="$APP"
          if [ ! -f "$app/tests/PharCompatTest.php" ]; then
            echo "$app ships no PharCompatTest — heavy arm not applicable"
            exit 0
          fi
          php scripts/pin-siblings.php inject "$APP" --root . --sha "$TAG_SHA" --ref "$TAG" \
            --out "${RUNNER_TEMP:-/tmp}/heavypins-$APP.json"
          cd "$app"
          composer install --prefer-dist --no-interaction --no-progress
          env_var="$(printf '%s' "$app" | tr '[:lower:]-' '[:upper:]_')_PHAR"
          env "$env_var=${GITHUB_WORKSPACE}/dist/$app.phar" vendor/bin/phpunit --no-coverage --filter PharCompatTest
        env:
          APP: ${{ needs.gate.outputs.app }}
          TAG_SHA: ${{ needs.gate.outputs.tag_sha }}
          TAG: ${{ needs.gate.outputs.tag }}

      - name: Publish GitHub release
        # G6-P OD-8: --target names the explicit tagged SHA — a release
        # created against a branch default would misstate which commit the
        # artifacts came from. The exists-path uploads onto the release this
        # door already created with the explicit target.
        run: |
          set -euo pipefail
          app="$APP"
          tag="$TAG"
          assets=("dist/$app.phar" "dist/$app.phar.sha256" "dist/$app.phar.commit" "dist/$app.phar.pins.json")
          if [ -f "dist/$app.phar.minisig" ]; then
            assets+=("dist/$app.phar.minisig" "dist/$app.phar.minisig.sha256" "dist/$app.phar.sha256.sig")
          fi
          notes="Self-contained $app PHAR built by .github/workflows/release-app-phar.yml at commit $TAG_SHA (CI-gated, siblings pinned).\n\nVerify: sha256sum -c $app.phar.sha256\n\nRun: php $app.phar --version\n\nAlso attached: $app.phar.commit (full build SHA), $app.phar.pins.json (sibling pin map)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$TAG_SHA" \
              --title "$app ${tag#"$app"/}" --verify-tag --notes "$(printf '%b' "$notes")"
          fi
        env:
          APP: ${{ needs.gate.outputs.app }}
          TAG: ${{ needs.gate.outputs.tag }}
          TAG_SHA: ${{ needs.gate.outputs.tag_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
