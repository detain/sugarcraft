# Build the candy-top PHAR and publish it on a release.
#
# Mirrors .github/workflows/release-phar.yml (candy-code's DST-1 pipeline —
# the reference; read-only to this program). Triggered by pushing a tag
# spelled `candy-top/v*` (per-lib tagging on the shared repo stream), or
# manually with a tag input.
#
# RELEASE POSTURE (OD-5/OD-7/OD-8, reviews-1103 G6-P): nothing publishes on
# untested bytes. The gate job refuses a tag whose commit is not an
# ancestor-or-self of master, then refuses to proceed until the CI workflow
# run AT THAT EXACT COMMIT is green (bounded poll, fail-closed on absence,
# red, or timeout). The release job checks the explicit commit out, builds
# it, and passes only the tagged SHA (never a branch name) as the release
# target_commitish. Provenance rides with the artifact as release assets:
# candy-top.phar.commit (the full build SHA) and candy-top.phar.pins.json
# (the resolved sibling pin map).
#
# REPRODUCIBILITY (OD-14 pinning half): the lock stays absent by house rule,
# but sugarcraft/* siblings no longer float on Packagist dev-master —
# scripts/pin-siblings.php injects TRANSIENT symlink:false path repositories
# over the tested checkout for the whole transitive require closure before
# composer install, and the verify mode aborts if any locked sibling still
# resolves from the network. The injection exists only inside this runner;
# committed manifests keep bare @dev requires (tools/check-path-repos.php
# --no-lib-path-repos stays green, pinned by tools/tests). The build script
# still REFUSES symlinked sibling vendors, dirty source trees, and detached
# HEADs; the checkout below attaches the explicit commit to a named branch
# because the preflight demands exactly that attribution.
#
# `phar.readonly=0` is passed with `-d` to the BUILD command only. It is
# never a runtime requirement: the produced archive executes under a normal
# `php candy-top.phar` with the default readonly=On.
#
# The signing step reads the sugarcraft-WIDE secret SUGARCRAFT_SIGNING_KEY
# (owner ruling 2026-10-21: one keypair signs every app's phar; each app
# pins the public half in its own source — candy-top pins it at
# SelfUpdate::PUBLIC_KEY_BASE64). Absent the secret, the build ships
# UNSIGNED exactly as candy-code's did before 2026-10-20; nothing else
# changes.
name: Release candy-top PHAR

on:
  push:
    tags:
      - 'candy-top/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing candy-top/v* tag to build and publish'
        required: true

permissions:
  contents: write

# G6-P OD-5: two releases of the same tag can never interleave (belt; the
# per-app lock lives on the release job's concurrency). cancel-in-progress
# false: a running release is finished, not cancelled by its successor.
concurrency:
  group: release-candy-top-phar-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    outputs:
      app: candy-top
      tag: ${{ steps.tag.outputs.tag }}
      tag_sha: ${{ steps.ancestry.outputs.tag_sha }}
      proceed: ${{ steps.ancestry.outputs.proceed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        # C-SES-9.d: a dispatched tag name is attacker-influenceable text and
        # `${{ }}` interpolation pastes it into the script BEFORE the shell
        # sees it — a ref containing a quote would break out of the run body.
        # Values now cross into the shell only through this step's `env:`.
        run: |
          set -euo pipefail
          if [ "$EVENT" = 'workflow_dispatch' ]; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.inputs.tag }}

      - name: Tag-ancestry door (OD-5)
        id: ancestry
        # A candy-top/v* tag that is not an ancestor-or-self of master is
        # orphaned intent — the release would ship bytes no CI leg ever
        # covered on the mainline. The SHA lands in this job's outputs so
        # every later step addresses the explicit commit, never a branch.
        run: |
          set -euo pipefail
          tag="$TAG"
          if ! printf '%s' "$tag" | grep -qE '^candy-top/v'; then
            echo "tag '$tag' is not a candy-top/v* tag — refusing to gate it here" >&2
            exit 1
          fi
          tag_sha="$(git rev-parse "$tag^{commit}")"
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$tag_sha" origin/master; then
            echo "refusing release of $tag ($tag_sha): not an ancestor-or-self of master" >&2
            exit 1
          fi
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ steps.tag.outputs.tag }}

      - name: CI-green door (OD-7)
        # Bounded poll for the CI workflow run AT THE TAGGED COMMIT — green
        # only. Fail-closed on every non-green shape: a completed red run is
        # fatal immediately, a missing or still-running CI is retried until
        # the attempt budget burns out and REFUSES the release. Tag pushes
        # trigger no CI leg of their own, so the wait is the normal case.
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            run_line="$(gh run list --workflow CI --branch master --commit "$TAG_SHA" \
              --limit 5 --json status,conclusion \
              --jq '[.[] | select(.status == "completed")] | if length == 0 then "PENDING" else (first(.[]) | .conclusion) end')"
            if [ "$run_line" = 'success' ]; then
              echo "CI is green at $TAG_SHA — releasing"
              exit 0
            fi
            case "$run_line" in
              PENDING)
                echo "CI at $TAG_SHA not concluded yet (attempt $attempt/240)"
                ;;
              *)
                echo "refusing release: CI at $TAG_SHA concluded '$run_line'" >&2
                exit 1
                ;;
            esac
            sleep 60
          done
          echo "refusing release: no green CI at $TAG_SHA within the poll budget (fail-closed)" >&2
          exit 1
        env:
          TAG_SHA: ${{ steps.ancestry.outputs.tag_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: gate
    runs-on: ubuntu-latest
    # G6-P OD-5: per-app concurrency lock — two candy-top releases serialize
    # here; other apps' release pipelines never share this group and proceed
    # in parallel.
    concurrency:
      group: release-candy-top-phar-${{ needs.gate.outputs.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # G6-P OD-8: build-at-SHA — the explicit tested commit, never a
          # branch or tag name, comes from the gate's ancestry resolution.
          ref: ${{ needs.gate.outputs.tag_sha }}
          fetch-depth: 0

      - name: Attach HEAD to the tag
        # The build's integrity preflight refuses detached HEADs (a tag
        # checkout IS detached); re-attaching the same commit to a branch
        # name keeps the artifact attributable without weakening the door.
        run: |
          set -euo pipefail
          git checkout -B phar-build "$TAG"
        env:
          TAG: ${{ needs.gate.outputs.tag }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          coverage: none
          # The full ci.yml extension list, not candy-code's slimmer set: the
          # heavy arm below boots candy-top's WHOLE suite to filter, and
          # candy-top's CI legs resolve against this exact environment.
          extensions: mbstring, intl, json, pcntl, sqlite3, pdo_sqlite, pdo_mysql, pdo_pgsql, ssh2, gd, curl, openssl, ffi

      - name: Pin sibling deps to the tested commit (OD-14)
        # Transient injection of symlink:false path repositories over this
        # checkout for the full transitive sugarcraft/* closure, so the
        # artifact is provably built from the SAME bytes the CI run covered
        # — the Packagist dev-master float is closed for releases. The
        # injection edits only the app manifest INSIDE THIS RUNNER; the
        # committed tree never carries it (path-repos inverse policy, pinned
        # by tools/tests). verify mode below re-proves nothing floated.
        # WF-CURE (#60/#68 lineage): the sidecar is born OUTSIDE the worktree
        # via --out — the old root-relative candy-top.pins.json relocation was
        # itself an untracked path in build-phar Guard 2's repo-wide porcelain.
        run: |
          set -euo pipefail
          php scripts/pin-siblings.php inject candy-top --root . --sha "$TAG_SHA" --ref "$TAG" \
            --out "${RUNNER_TEMP:-/tmp}/pins-candy-top.json"
        env:
          TAG_SHA: ${{ needs.gate.outputs.tag_sha }}
          TAG: ${{ needs.gate.outputs.tag }}

      - name: Install production dependencies
        run: |
          set -euo pipefail
          cd candy-top
          # A linked-mode local checkout can carry a path-repo lock; CI starts
          # from git, and the build REFUSES symlinked vendors as the second
          # line of defence against frozen sibling WIP.
          rm -f composer.lock
          composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Verify no sibling floated to the network (OD-14)
        # Fail-closed float detector over the resolved lock: every locked
        # sugarcraft/* package must carry a path dist. If Packagist ever
        # wins a resolution race, the release stops HERE, not in the notes.
        run: |
          set -euo pipefail
          php scripts/pin-siblings.php verify candy-top
          # WF-CURE: no sidecar mv here — inject already parked it outside
          # the worktree (--out, RUNNER_TEMP); verify reads only the lock.

      - name: Restore app manifest + prove Guard 2 preconditions (WF-CURE)
        # OD-14's inject rewrites the tracked candy-top/composer.json, and
        # build-phar Guard 2's porcelain is REPO-WIDE (`git -C candy-top
        # status --porcelain` reports every path of the monorepo), so the
        # injected manifest froze the stable v* train from 2026-11-04 on
        # (#101/#102). The injection has done its job by now — vendor holds
        # the pinned bytes and build-phar reads vendor/composer/installed.json,
        # never the manifest — so restore it, then prove Guard 2's exact
        # precondition at the seat: the tripwire runs the same repo-wide
        # porcelain, so a red names the lingering path here instead of a bare
        # exit 2 from inside the build. The heavy arm below re-injects for its
        # dev install. The guard itself stays untouched (ceiling-silence law).
        run: |
          set -euo pipefail
          git checkout -- candy-top/composer.json
          dirty="$(git -C candy-top status --porcelain)"
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty"
            echo "::error::tree still dirty for Guard 2 after manifest restore (repo-wide porcelain via -C candy-top)"
            exit 1
          fi

      - name: Build the archive
        run: |
          set -euo pipefail
          # SOURCE_DATE_EPOCH pins metadata['built_at'] to the tagged commit's
          # date so rebuilds of one tag agree on the stamp (DST-1
          # reproducibility note); the dependency window no longer moves —
          # siblings ride the injected pins of this exact commit (OD-14).
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%cT "$TAG")"
          php -d phar.readonly=0 candy-top/tools/build-phar.php \
            --out=dist/candy-top.phar \
            --version="$TAG"
        env:
          TAG: ${{ needs.gate.outputs.tag }}

      - name: Checksum
        # RT-46: ordering mirrors release-app-phar.yml's C-SES-5.c note — this
        # runs BEFORE signing on purpose, because the headline signature is
        # over this sidecar's body, so the sidecar has to exist first.
        run: |
          set -euo pipefail
          (cd dist && sha256sum candy-top.phar > candy-top.phar.sha256)
          cat dist/candy-top.phar.sha256

      - name: Sign the archive (pinned-key mode)
        # OPTIONAL step by design: without the SUGARCRAFT_SIGNING_KEY secret it
        # skips green and the release ships unsigned. When the owner has the
        # secret populated AND SelfUpdate::PUBLIC_KEY_BASE64 carries the
        # matching public half (both true as of the sugarcraft-wide key
        # pinning), this emits — same three legs and same semantics as the
        # app-phar reference pipeline, verified against the key pinned in
        # source rather than against anything the release channel controls:
        #   - candy-top.phar.sha256.sig: base64 detached sodium signature over
        #     the .sha256 SIDECAR BODY (the leg a pinned-key self-update
        #     verifies before trusting the sidecar to gate a swap; RT-46 adds
        #     the leg this workflow used to omit).
        #   - candy-top.phar.minisig: the legacy raw-byte signature, kept
        #     additively for older clients.
        #   - candy-top.phar.minisig.sha256: computed here, not in the (now
        #     earlier) checksum step, since it can only exist after its file.
        # In keyless state all three are skipped together: one early-exit
        # step, and the publish gate below sees no signature files.
        run: |
          set -euo pipefail
          if [ -z "${SUGARCRAFT_SIGNING_KEY:-}" ]; then
            echo "::notice::SUGARCRAFT_SIGNING_KEY secret not set — shipping unsigned (keyless state)"
            exit 0
          fi
          php -r '
            $key = base64_decode(getenv("SUGARCRAFT_SIGNING_KEY"), true);
            if ($key === false || strlen($key) !== SODIUM_CRYPTO_SIGN_SECRETKEYBYTES) {
              fwrite(STDERR, "SUGARCRAFT_SIGNING_KEY must be the base64 of the 64-byte sodium secret key\n");
              exit(1);
            }
            $sig = sodium_crypto_sign_detached(file_get_contents("dist/candy-top.phar"), $key);
            file_put_contents("dist/candy-top.phar.minisig", base64_encode($sig) . "\n");
            $sidecar_sig = sodium_crypto_sign_detached(file_get_contents("dist/candy-top.phar.sha256"), $key);
            file_put_contents("dist/candy-top.phar.sha256.sig", base64_encode($sidecar_sig) . "\n");
          '
          (cd dist && sha256sum candy-top.phar.minisig > candy-top.phar.minisig.sha256)
          cat dist/candy-top.phar.minisig
        env:
          SUGARCRAFT_SIGNING_KEY: ${{ secrets.SUGARCRAFT_SIGNING_KEY }}

      - name: Provenance sidecars (OD-8)
        # The shipped artifact stays traceable to its tested SHA without
        # touching build-phar or app source: candy-top.phar.commit carries
        # the full build commit, candy-top.phar.pins.json the sibling pin map
        # the verify step confirmed. Both publish as release assets below.
        run: |
          set -euo pipefail
          printf '%s\n' "$TAG_SHA" > dist/candy-top.phar.commit
          mv "${RUNNER_TEMP:-/tmp}/pins-candy-top.json" dist/candy-top.phar.pins.json
          test -s dist/candy-top.phar.pins.json
          cat dist/candy-top.phar.commit
        env:
          TAG_SHA: ${{ needs.gate.outputs.tag_sha }}

      - name: Smoke — version
        # DST-1's release-shape proof: this must print the TAGGED version,
        # read back from the archive's stamped metadata — never the frozen
        # vendor/'s dev-master.
        run: php dist/candy-top.phar --version

      - name: Smoke — help surface on a virgin HOME
        # The candy-code pipeline's headless-echo arm is app-specific (a chat
        # turn); candy-top is a TUI with no one-shot prompt. Its non-TTY
        # contract is the help page, which must render with no config, no
        # themes dir, and no controlling terminal — and now carries the
        # self-update verb line this release stream depends on.
        run: |
          set -euo pipefail
          fake_home="$(mktemp -d)"
          HOME="$fake_home" php dist/candy-top.phar --help | grep -q 'self-update'

      - name: Smoke — archive scanners are alive under phar://
        # The archive is addressed as a phar:// URI, never as a bare
        # '/x.phar/entry' path: measured on PHP 8.3.6 in candy-code's run
        # 39355949075, bare paths fail is_file()/require for every caller —
        # bin/candy-top's autoload guard and PharCompatTest's stub pins
        # document the same measurement, and the phar:// URI is the only form
        # the extension honours. Double quotes only in the php body below: it
        # is embedded in a shell single-quoted argument.
        run: |
          set -euo pipefail
          php -r '
            $phar = getenv("PHAR_PATH");
            require "phar://" . $phar . "/vendor/autoload.php";
            $themes = \SugarCraft\Top\Theme\ThemeRegistry::new()->names();
            $index  = is_file(\SugarCraft\Top\View\Logo::DIR . "/logos.jsonl");
            if (count($themes) === 0 || !$index) {
              fwrite(STDERR, "phar scanner census empty: themes=" . count($themes) . " logo_index=" . ($index ? "yes" : "no") . "\n");
              exit(1);
            }
            echo "phar scanners alive: " . count($themes) . " themes, logo index present\n";
          '
        env:
          PHAR_PATH: ${{ github.workspace }}/dist/candy-top.phar

      # Deliberately NO `apt-get install ripgrep` step (candy-code's cure for
      # GrepEngineDifferentialTest's empty-data-set suite-load ERROR): no
      # candy-top provider depends on rg, so the failure class cannot occur
      # in the heavy arm below.

      - name: PharCompatTest heavy arm
        # The archive is real; run the suite's CANDY_TOP_PHAR-gated stage 4
        # against it (PharCompatTest's docblock promises this workflow "builds
        # an archive, exports CANDY_TOP_PHAR, and runs this file" — this step
        # makes that sentence true). Dev dependencies are installed only now:
        # the artifact above was built from the --no-dev vendor, and
        # re-running install does not touch dist/.
        # WF-CURE: the manifest was restored before the build, so re-inject
        # the same closure (throwaway sidecar under RUNNER_TEMP) first — this
        # dev install must resolve siblings from the tested bytes, never from
        # the Packagist dev-master float that OD-14 closed for releases.
        run: |
          set -euo pipefail
          php scripts/pin-siblings.php inject candy-top --root . --sha "$TAG_SHA" --ref "$TAG" \
            --out "${RUNNER_TEMP:-/tmp}/heavypins-candy-top.json"
          cd candy-top
          composer install --prefer-dist --no-interaction --no-progress
          CANDY_TOP_PHAR="${GITHUB_WORKSPACE}/dist/candy-top.phar" vendor/bin/phpunit --no-coverage --filter PharCompatTest
        env:
          TAG_SHA: ${{ needs.gate.outputs.tag_sha }}
          TAG: ${{ needs.gate.outputs.tag }}

      # Deliberately NO upload-artifact step: nothing consumes a run artifact
      # (the release job publishes dist/candy-top.phar and its sidecars
      # directly as release assets), and
      # deriving an artifact name from the tag carries the namespace '/' that
      # upload-artifact refuses — candy-code's run 39379594999 died on exactly
      # that. If a future job ever needs the archive, add a sanitized name
      # here (steps.tag output stripped of the `candy-top/` prefix), never the
      # raw tag.
      - name: Publish GitHub release
        # G6-P OD-8: --target names the explicit tagged SHA — a release
        # created against a branch default would misstate which commit the
        # artifacts came from. The exists-path uploads onto the release this
        # door already created with the explicit target.
        run: |
          set -euo pipefail
          tag="$TAG"
          assets=(dist/candy-top.phar dist/candy-top.phar.sha256 dist/candy-top.phar.commit dist/candy-top.phar.pins.json)
          if [ -f dist/candy-top.phar.minisig ]; then
            assets+=(dist/candy-top.phar.minisig dist/candy-top.phar.minisig.sha256)
          fi
          if [ -f dist/candy-top.phar.sha256.sig ]; then
            assets+=(dist/candy-top.phar.sha256.sig)
          fi
          notes="Self-contained candy-top PHAR built by .github/workflows/release-candy-top-phar.yml at commit $TAG_SHA (CI-gated, siblings pinned).\n\nVerify: sha256sum -c candy-top.phar.sha256\n\nRun: php candy-top.phar --version\n\nAlso attached: candy-top.phar.commit (full build SHA), candy-top.phar.pins.json (sibling pin map)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$TAG_SHA" \
              --title "candy-top ${tag#candy-top/}" --verify-tag --notes "$(printf '%b' "$notes")"
          fi
        env:
          TAG: ${{ needs.gate.outputs.tag }}
          TAG_SHA: ${{ needs.gate.outputs.tag_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
