name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# PHP-action pins, 2026-11-11 (F1-2604): setup-php eb7c497 = 2.40.0 and
# cache-extensions 695b1b46 = 1.15.11 are the first releases that support
# Ubuntu 26.04 'resolute' (setup-php issue #1083 closed by 2.40.0; the
# cache-extensions 26.04 fix switched its Packages.gz scrape to
# packages.sury.org, since the ondrej PPA never published past noble and
# the old 1.14.6 scrape curl-404'd the whole job in ~1s). ubuntu-latest
# went 24.04 -> 26.04 in Nov 2026; do NOT down-pin runs-on — update the
# pins instead (owner ruling). candy-code/docs/CI.md carries the refresh cadence.
env:
  # Belt-and-suspenders: every action below is already pinned to its
  # Node-24-native major (checkout@v5, cache@v5, setup-php@v2 ≥2.40),
  # but this flag keeps any transitively-loaded JavaScript action that
  # still defaults to Node 20 from generating deprecation warnings.
  # Requires Actions Runner ≥ 2.327.1 (already the default on
  # ubuntu-latest as of 2025-Q4).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

  # Single source of truth for the PHP extension union — referenced by
  # both the cache-extensions step (for cache-key computation) and the
  # setup-php step (for the actual install). See the test job for why
  # we install everything on every cell.
  PHP_EXTENSIONS: mbstring, intl, json, pcntl, sqlite3, pdo_sqlite, pdo_mysql, pdo_pgsql, ssh2, gd, curl, openssl, ffi

  # CI checks the repo out at a detached merge ref, so each lib's root package
  # versions as `dev-<sha>`. Libs with a circular intra-monorepo dependency
  # (e.g. sugar-core ⇆ sugar-pty) then fail install because the sibling's
  # back-requirement on `dev-master` doesn't match the root's `dev-<sha>`.
  # Pin the root version so composer treats every lib-under-test as dev-master.
  COMPOSER_ROOT_VERSION: dev-master

jobs:
  # Compute every job's matrix by diffing the change-set and walking the
  # reverse-dep graph from each lib's composer.json (see scripts/affected-libs.php).
  # Only libs whose own files changed — plus the transitive closure of libs that
  # require them — get tested. A `sugar-core` change fans out to ~40 libs; a
  # `candy-code` change scopes down to one cell.
  #
  # Force-all triggers (script-side): root composer.json/composer.lock change,
  # the workflow itself changing, or the script changing. workflow_dispatch and
  # unresolvable git ranges (shallow clones, first commit on branch) also
  # force-all from the workflow side.
  #
  # Empty matrices are a hard error at job setup (the run goes red with zero
  # failing check_runs), so every matrix job carries an
  # `if: needs.build-matrix.outputs.<X>_count != '0'` guard. The guard skip may
  # emit a placeholder check_run with the literal `${{ matrix.* }}` template
  # text in its name — cosmetic noise, accepted over red docs-only pushes.
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.compute.outputs.test_matrix }}
      coverage_libs: ${{ steps.compute.outputs.coverage_libs }}
      phpstan_matrix: ${{ steps.compute.outputs.phpstan_matrix }}
      windows_matrix: ${{ steps.compute.outputs.windows_matrix }}
      macos_matrix: ${{ steps.compute.outputs.macos_matrix }}
      # Cell counts — each matrix job gates on its count being non-zero.
      # An empty matrix (even the `{include: []}` shape) is a hard error at
      # job setup ("Matrix must define at least one vector"): the job emits
      # no check_run but still marks the whole RUN failed, so docs-only and
      # narrow pushes went red with every visible job green.
      test_count: ${{ steps.compute.outputs.test_count }}
      coverage_count: ${{ steps.compute.outputs.coverage_count }}
      phpstan_count: ${{ steps.compute.outputs.phpstan_count }}
      windows_count: ${{ steps.compute.outputs.windows_count }}
      macos_count: ${{ steps.compute.outputs.macos_count }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Need both endpoints of the diff. For push events GitHub sets
          # `event.before`; for PRs the base ref needs to be fetched too.
          # fetch-depth: 0 is the simple, robust choice — the repo is small.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          coverage: none

      - id: compute
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          IS_MASTER_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          set -euo pipefail
          ZERO="0000000000000000000000000000000000000000"
          MODE="--all"
          case "$EVENT_NAME" in
            workflow_dispatch)
              MODE="--all"
              ;;
            pull_request)
              if [ -n "${BASE_SHA:-}" ]; then
                git fetch --no-tags --depth=200 origin "$BASE_SHA" 2>/dev/null || true
                MODE="--range ${BASE_SHA}..${HEAD_SHA}"
              fi
              ;;
            push)
              if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "$ZERO" ]; then
                MODE="--range ${BEFORE_SHA}..${HEAD_SHA}"
              fi
              ;;
          esac

          echo "affected-libs mode: $MODE" >&2
          # shellcheck disable=SC2086 # intentional word-split for --range
          JSON=$(php scripts/affected-libs.php $MODE)
          echo "$JSON" | jq -r '. | "force_all=\(.force_all) changed=\(.changed_libs | length) affected=\(.affected | length)"' >&2

          # SEC-01 (ci-matrix script injection): defense-in-depth slug gate.
          # Every lib slug that is about to be exported — the .lib arrays and
          # include[].lib of each matrix, plus the flat coverage_libs list —
          # must be strict kebab-ASCII. affected-libs.php already refuses to
          # emit anything else; this gate guarantees no future generator can
          # regress that and let a crafted name reach a `run:` body.
          while IFS= read -r SLUG; do
            if ! printf '%s' "$SLUG" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
              echo "::error::build-matrix: lib slug rejected (must match ^[a-z0-9][a-z0-9-]*\$): '$SLUG'"
              exit 1
            fi
          done < <(echo "$JSON" | jq -r '[
              (.test_matrix.lib // []),
              ((.test_matrix.include // []) | map(.lib? // empty)),
              (.coverage_libs // []),
              (.phpstan_matrix.lib // []),
              ((.phpstan_matrix.include // []) | map(.lib? // empty)),
              (.windows_matrix.lib // []),
              ((.windows_matrix.include // []) | map(.lib? // empty)),
              (.macos_matrix.lib // []),
              ((.macos_matrix.include // []) | map(.lib? // empty))
            ] | add | .[] | select(. != null)')

          # Coverage only runs on push-to-master (cost gate kept).
          if [ "$IS_MASTER_PUSH" != "true" ]; then
            JSON=$(echo "$JSON" | jq '.coverage_libs = []')
          fi

          # Cell count per matrix: `{php: [...], lib: [...]}` cross-product
          # or the `{include: []}` empty shape.
          COUNT='if has("lib") then ((.lib | length) * (.php | length)) else (.include | length) end'

          {
            echo "test_matrix=$(echo "$JSON" | jq -c '.test_matrix')"
            echo "coverage_libs=$(echo "$JSON" | jq -c '.coverage_libs')"
            echo "phpstan_matrix=$(echo "$JSON" | jq -c '.phpstan_matrix')"
            echo "windows_matrix=$(echo "$JSON" | jq -c '.windows_matrix')"
            echo "macos_matrix=$(echo "$JSON" | jq -c '.macos_matrix')"
            echo "test_count=$(echo "$JSON" | jq -c ".test_matrix | $COUNT")"
            echo "coverage_count=$(echo "$JSON" | jq -c '.coverage_libs | length')"
            echo "phpstan_count=$(echo "$JSON" | jq -c ".phpstan_matrix | $COUNT")"
            echo "windows_count=$(echo "$JSON" | jq -c ".windows_matrix | $COUNT")"
            echo "macos_count=$(echo "$JSON" | jq -c ".macos_matrix | $COUNT")"
          } >> "$GITHUB_OUTPUT"

  # Path-repo policy, which is INVERTED between the committed tree and the CI
  # checkout, and the direction matters:
  #
  #   committed  no <lib>/composer.json may carry a sibling path-repo. Each lib
  #              is published standalone as sugarcraft/<lib>, and Composer's
  #              PathRepository HARD FAILS on a url that does not exist, so
  #              `../sugar-cellbuffer` breaks `composer install` for anyone who
  #              clones the split repo. (Harmless to consumers who merely
  #              `require` the package: Composer honours `repositories` only on
  #              the ROOT package and ignores a dependency's.)
  #   CI / local the entries are re-injected by `--fix --strict-closure` before
  #              each `composer install` (see the "Link sibling libs" steps), so
  #              a PR's own sibling code is what gets tested rather than
  #              whatever is published on Packagist.
  #
  # The monorepo root keeps its full closure in git — the root IS the directory
  # those ../ urls resolve against.
  # WHAT THIS JOB IS AND WHY IT IS NOT PART OF `path-repo-check`.
  #
  # `tools/tests/` began life as the guard for `tools/check-path-repos.php`'s
  # classifiers — which is why it was a STEP of the path-repo job, running
  # first so that a red there meant the manifest verdicts underneath it were
  # not worth reading. That ordering is preserved by `needs:` below, and is now
  # sharper: a red here SKIPS the manifest job rather than burying it.
  #
  # THE REASON FOR THE SPLIT IS THE JOB NAME, NOT THE ORDERING. `tools/tests/`
  # has since grown guards that have nothing to do with composer manifests, and
  # one of them — `tools/tests/StackedDocCommentTest.php` — pins its copy of a
  # scanner against the canonical implementation in
  # `candy-code/tests/Diagnostics/RuntimeNoticeSinkDeliveryTest.php`. So a
  # contributor who changes `stackedDocCommentLines()` by one token in
  # `candy-code` gets a red from a job called "Path-repo policy", whose name
  # offers no hint at all of the reason. That is a real cost — a red whose name
  # misdescribes it is read as flaky infrastructure — and this job's name is
  # the fix. The failure text names the file to port the change into; the job
  # name now names the family the failure belongs to.
  #
  # AND THE NAME HAD TO MOVE AGAIN, ONE ROUND LATER, FOR THE SAME REASON.
  # WHAT IT SAID: "tools/ guards (classifiers, docs generator, scanner-copy
  # drift)". WHAT IS TRUE NOW: `tools/tests/BareCitationDriftTest.php` reads
  # every `.php` file under `sugar-pty/` as well — `src/`, `bin/` and `tests/`
  # — so editing a doc-block in a PUBLISHED package can now red this job, and
  # that name told a contributor working in `sugar-pty` nothing whatsoever.
  # WHY THE PARAGRAPH ABOVE STILL EARNS ITS PLACE: it is the argument, and the
  # argument generalises past the case that produced it. A job under `tools/`
  # that reaches into other packages will keep acquiring reasons to red that
  # its own directory name cannot express, so the name states the REACH rather
  # than trying to enumerate the guards. The enumeration is what rotted in one
  # round; `tools/tests/` is what a reader should go and list.
  #
  # AND THE NAME IS NO LONGER FREE TEXT (E629): `tools/tests/CheckPathReposTest.php`'s
  # testTheGuardJobNameIsACheckedArtefact() compares this string against a
  # literal in that file. A rename that outruns the argument above now fails
  # a test instead of rotting quietly — move the literal and this paragraph
  # in the same edit if the judgement changes again.
  tools-guards:
    name: 'tools/ guards (+ drift pins that read sugar-pty/ and candy-code/)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          coverage: none
          # phpunit as a PHAR. Nothing under `tools/` is a composer package —
          # there is no `tools/composer.json` and so no per-lib
          # `vendor/bin/phpunit` to borrow, in this job or any other.
          #
          # PINNED TO 10 DELIBERATELY. Bare `tools: phpunit` resolves to the
          # newest major supporting the requested PHP, so this job would follow
          # PHPUnit's release train on its own; tools/tests/ are PHPUnit 10
          # files (their own doc-blocks say so), and the day the PHAR moves to a
          # major that drops something they use, a job with nothing to do with
          # the change goes red. See CONTRIBUTING.md, which documents the same
          # pin for the local form of this command.
          tools: phpunit:10
      # THESE FILES EXISTED UNRUN FOR SIX MONTHS: referenced by no phpunit.xml,
      # no composer autoload and, until round 58, no workflow. Every step of
      # `path-repo-check` is a hard gate whose classifier nothing checked.
      - name: Verify the tools/ guards
        run: phpunit --no-configuration --colors=never tools/tests/

  # G6-P (OD-6, reviews-1103): the publishers (sync-sugarcraft, phar-latest) poll
  # THIS workflow for their gate, so a green CI must already mean the shipped
  # web bundle is verified — not just the PHP legs. web.yml stays the deep
  # pipeline (audit, lint, typecheck, unit, e2e); this job mirrors only the
  # legs whose verdict a publisher is made to vouch for: the lockfile install,
  # the generated protocol types, the bundle build, and committed-dist parity.
  # Unconditional on every event: CI green at a SHA ⊇ bundle green at that SHA
  # (a path-scoped web.yml run would leave unrelated SHAs bundle-unverified —
  # publishing a stale bundle was the CW-P1-class harm this gate closes).
  web-bundle:
    name: 'candy-code-web · bundle build + dist parity'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: candy-code-web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: candy-code-web/.nvmrc
          cache: npm
          cache-dependency-path: candy-code-web/package-lock.json

      - name: Install (lockfile only)
        run: npm ci

      - name: Protocol types match the server schema
        run: |
          npm run gen:protocol
          if ! git diff --exit-code -- src-web/protocol/generated.ts; then
            echo "::error::candy-code-web/src-web/protocol/generated.ts is stale. Run 'npm run gen:protocol' in candy-code-web/ and commit it."
            exit 1
          fi

      - name: Build
        run: npm run build

      # Both halves matter: `git diff` catches a changed or deleted committed
      # file, and the porcelain check catches a NEW emitted file (a renamed
      # content-hashed chunk) that was never committed.
      - name: Committed dist/ matches the source
        run: |
          if ! git diff --exit-code -- dist/ || [ -n "$(git status --porcelain -- dist/)" ]; then
            git status --short -- dist/
            echo "::error::candy-code-web/dist/ is stale. Run 'npm ci && npm run build' in candy-code-web/ and commit dist/ with the source change — same commit, per the dist-freshness law. 'npm run check:dist' reproduces this verdict locally before you push."
            exit 1
          fi
          echo "OK: dist/ is byte-identical to a clean build of src-web/"

  path-repo-check:
    name: 'Path-repo policy'
    runs-on: ubuntu-latest
    # RUNS AFTER THE CLASSIFIER GUARD, for the same reason that guard used to be
    # this job's first step: every verdict below is produced by
    # `tools/check-path-repos.php`, and a run of it whose own classifiers are
    # red is not evidence about the manifests.
    needs: [tools-guards]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify no sibling path-repos in published manifests
        run: php tools/check-path-repos.php --no-lib-path-repos
      - name: Verify the root closure is complete
        run: php tools/check-path-repos.php
      - name: Verify no unused path-repo deps
        run: php tools/check-path-repos.php --unused
      - name: Verify injection restores a full local closure
        run: |
          php tools/check-path-repos.php --fix --strict-closure
          php tools/check-path-repos.php --strict-closure
          git checkout -- .
      # E486, closing E448. candy-code's DescriptorInheritanceGuardTest can
      # only reach the eighteen libraries in ITS vendor/sugarcraft closure;
      # the three exposed spawns E448 measured (sugar-dashboard, sugar-video x2) sat
      # outside that reach, where a new one could appear with nothing saying
      # so. This pass reads the declared autoload roots of all 57 other libs
      # from the same checkout — no dependency changes, which is why it lives
      # here rather than in a per-lib suite (the promotion-to-sugar-testing
      # option measured weaker). Fail-closed: an exposed, unclassified, or
      # unresolved proc_open appearance with no roster row exits 1 and prints
      # the exact key to judge and paste. Placed last so it reads the tree the
      # injection step restored, not manifests mid-flip.
      - name: Verify child-lifetime accounting across every lib
        run: php tools/check-child-lifetimes.php
      # Composer's PSR-4 autoloader finds a type only in the file named after
      # it, so a second type declared inside another class's file is "class
      # not found" unless its host loaded first (candy-code App\LayoutResetMsg
      # really died this way; sugar-dashboard's twice-declared SortDirection was a
      # redeclaration fatal). All 13 affected libs were split one type per
      # file; this keeps it so. tools/tests/OneTypePerFileToolTest.php guards
      # the checker itself.
      - name: Verify one type per PSR-4 file across every lib
        run: php tools/check-one-type-per-file.php
      # ISS-120 (sugar_issues.md): sync-sugarcraft.yml splits each package
      # with a SINGLE `splitsh-lite --prefix="$lib"` (multi-prefix is a parse
      # error in the pinned v1.0.1), so a root-only LICENSE never reaches a
      # split repo and every README `](LICENSE)` badge there is dead. The fix
      # is a copy of the root LICENSE committed in all 61 package dirs; this
      # guard keeps them byte-identical and forbids `](../LICENSE)` upward
      # links, deriving the package set with the workflow's own enumerator
      # (scripts/affected-libs.php --all). Fail-closed: empty or broken
      # enumeration exits 2. tools/tests/CheckLibLicensesTest.php guards the
      # checker itself.
      - name: Verify every split package carries the root LICENSE
        run: php tools/check-lib-licenses.php

  # The per-lib detail pages under docs/lib/ are GENERATED by tools/gen-docs.php
  # from docs/_data/, and AGENTS.md + CLAUDE.md both instruct every contributor
  # and agent never to hand-edit them. `--check` regenerates in memory and exits
  # 1 on any difference -- the script's own header has called it "a CI drift
  # guard" since it was written, and until now NO workflow ran it. pages.yml
  # uploads docs/ verbatim to GitHub Pages on every push to master, so a
  # hand-edit published to the public site and survived there until the next
  # unrelated gen-docs.php run reverted it with no diff to explain why.
  # tools/tests/GenDocsTest.php guards the checker itself; this runs it.
  docs-generated:
    name: 'Generated docs pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify docs/lib pages match their generator
        run: php tools/gen-docs.php --check
      - name: Verify docs site asset references (icons, demo GIFs, local links)
        run: php tools/check-docs-assets.php
      - name: Verify root-doc lib rows match the post-drain seed corpus
        run: php tools/check-root-rows.php
      # RT-32 (repo-tooling-035, OG-8 recommend arm): gen-ansi-readme's header has
      # called --check "the CI guard" since it was written, yet no workflow ran it —
      # the same documented-guard-without-seat class as RT-19. Pure PHP, composer-less
      # like its neighbours, and it passes today (3,595 pieces agree), so seating
      # costs one CI minute and makes the header's claim true. tools/tests/
      # GenAnsiReadmeTest.php pins this seat and guards the checker itself.
      - name: Verify ansi/README.md tables match the art-corpus JSON
        run: php tools/gen-ansi-readme.php --check

  # RT-19 (repo-tooling-021): the committed narrative pages under docs/
  # (GETTING-STARTED, GLOSSARY, KEYMAPS, TRUST-BOUNDARY and friends) are
  # GENERATED by tools/gen-doc-pages.php from their Markdown sources, and the
  # tool's own --check arm had zero CI seat — `grep -rn gen-doc-pages
  # .github/workflows/` was empty, and GenDocPagesTest's render-drift arms
  # markTestSkipped because no workflow job installed a vendor. A PR editing a
  # .md without regenerating the .html published stale bytes silently. OG-4
  # ruling default: a DEDICATED job (the [REC] arm) rather than dragging a
  # composer install into the vendor-free docs-generated job. The install leg
  # is the shape findAutoloader's own error message documents: sugar-markdown
  # is the package that requires league/commonmark; --no-dev because this job
  # renders, it runs no lib tests. tools/tests/GenDocPagesTest.php keeps
  # guarding the generator's logic; this step runs it against the real tree.
  narrative-docs:
    name: 'Generated narrative pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          coverage: none
      - name: Install the page renderer (league/commonmark via sugar-markdown)
        run: composer install --no-dev --no-progress --no-interaction -d sugar-markdown
      - name: Verify narrative docs pages match their Markdown sources
        run: php tools/gen-doc-pages.php --check

  # Guard against SugarCraft-org doc links pinned to the pre-flip default branch.
  # The org default branch moved main→master (see CONTRIBUTING.md "flip every
  # default branch from main → master"), so every
  # github.com/sugarcraft/<lib>/blob/main/... link under docs/ now 404s. This
  # step fails the build if any resurface. It is deliberately scoped to the
  # sugarcraft org: upstream repos (charmbracelet, Textualize, python/cpython,
  # git-lfs, …) legitimately still use `main`, so a blanket `blob/main/` check
  # would flag correct links. Cheap — one grep, no PHP/composer needed.
  docs-links:
    name: 'Docs branch links'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Reject stale sugarcraft blob/main links under docs/
        run: |
          if grep -rEn 'github\.com/sugarcraft/[^/]+/blob/main/' docs/; then
            echo "::error::Found github.com/sugarcraft/.../blob/main/ link(s) under docs/ — the org default branch is master. Replace blob/main/ with blob/master/ (offending lines listed above)."
            exit 1
          fi
          echo "OK: no stale sugarcraft blob/main links under docs/"

  # Every catalog icon must exist identically in both media/icons/ (canonical,
  # consumed by the org-repo sync) and docs/img/icons/ (served by the public
  # site). A lib added to one dir but not the other renders a broken tile, so
  # this step fails the build when the two basename sets diverge. Cheap — one
  # diff, no PHP/composer needed.
  icon-sync:
    name: 'Icon media↔docs parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: icon media↔docs basename parity
        run: diff <(ls media/icons | sort) <(ls docs/img/icons | sort)

  # Unified test matrix — every (php, lib) tuple comes from build-matrix, which
  # auto-discovers libs from filesystem (any dir with composer.json + phpunit.xml)
  # and scopes to libs affected by the change-set via the reverse-dep graph.
  # Per-PHP-version filtering happens inside scripts/affected-libs.php.
  test:
    name: 'Test PHP ${{ matrix.php }} · ${{ matrix.lib }}'
    runs-on: ubuntu-latest
    needs: [build-matrix]
    # Skip (not fail) when the change-set touches no libs — an empty matrix
    # errors at job setup and flips the whole run red. The skip may emit one
    # placeholder check_run with the unexpanded name template; cosmetic, and
    # far better than a guaranteed-failed run on docs-only pushes.
    if: needs.build-matrix.outputs.test_count != '0'
    # All pushes to the same branch share ONE concurrency group per matrix cell.
    # When a new commit arrives, any in-progress jobs from the previous commit
    # are cancelled immediately — no waiting for the old run to finish.
    concurrency:
      group: ci-test-${{ github.ref }}-${{ matrix.lib }}-${{ matrix.php }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      # Cap concurrent cells so 45+ matrix jobs don't all hammer
      # GITHUB_TOKEN's checkout auth at workflow start — secondary
      # rate limiting was causing "could not read Username" failures
      # on random cells (see flakes on candy-wish, honey-bounce). @rename-keep historical provenance
      max-parallel: 10
      matrix: ${{ fromJSON(needs.build-matrix.outputs.test_matrix) }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Cache the *built* PHP extension binaries (ssh2 / gd / curl / sqlite3
      # / pdo_sqlite — the ones that aren't bundled with the runner image).
      # Without this, every matrix cell rebuilds them from PECL, adding
      # 5–10s × 164 cells = ~20 minutes of total CPU per push.
      - name: Compute PHP-extension cache key
        id: ext-cache
        uses: shivammathur/cache-extensions@695b1b465eba861efe67cbbc31252c27f5ed253d
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          # Bump key suffix when adding/removing extensions or when a runner
          # image upgrade invalidates ABI compatibility.
          key: php-ext-v4

      - name: Restore PHP extensions
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.ext-cache.outputs.dir }}
          key: ${{ steps.ext-cache.outputs.key }}
          restore-keys: ${{ steps.ext-cache.outputs.key }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      - name: Get composer cache dir
        id: cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-

      # Cache the per-lib vendor/ directory keyed on its composer.json. When
      # only one lib changes, every other lib's vendor cache hits and
      # composer install becomes a ~100ms validation pass. The fallback
      # restore-keys lets a sibling-lib's cache seed dependency resolution
      # before composer fills in the rest from the warm composer cache.
      - name: Cache vendor/
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ matrix.lib }}/vendor
          # restore-keys deliberately scoped to the same v3 version + lib +
          # PHP combo. Older fallback `vendor-${matrix.php}-${matrix.lib}-`
          # was too loose — it would match any prior cache namespace and
          # return a stale vendor/ even when composer.json's closure had
          # grown new deps. Coverage hit this exact bug (#857).
          key: vendor-v3-${{ matrix.php }}-${{ matrix.lib }}-${{ hashFiles(format('{0}/composer.json', matrix.lib)) }}
          restore-keys: |
            vendor-v3-${{ matrix.php }}-${{ matrix.lib }}-

      # Re-inject the sibling path-repos that are deliberately absent from the
      # committed manifests (see the path-repo-check job). Without this, every
      # sugarcraft/* dep resolves from Packagist and a PR that breaks a sibling
      # would go green here.
      - name: Link sibling libs
        run: php tools/check-path-repos.php --fix --strict-closure

      - name: Install dependencies
        env:
          MAT_LIB: ${{ matrix.lib }}
        run: cd "$MAT_LIB" && composer install --prefer-dist --no-progress -n

      # The channel bundles (candy-msteams, candy-discord) are tested against the
      # host tree: tests/bootstrap.php loads ../candy-code/vendor/autoload.php
      # directly, and CI only installs the lib's own vendor/. Install the host
      # vendor first so those cells can boot.
      - name: Install host vendor (channel bundle tests)
        if: matrix.lib == 'candy-msteams' || matrix.lib == 'candy-discord'
        run: cd candy-code && composer install --prefer-dist --no-progress -n

      # rv-sec-5 (crush-review-1014): dependency vulnerability audit for the
      # flagship app. FAILS ONLY ON HIGH/CRITICAL advisories — low/medium are
      # ignored by severity so the gate stays actionable instead of rotting
      # into rerun-noise. `composer install` with no committed lock writes a
      # fresh lock on the runner, and audit reads exactly that (per-lib
      # composer.lock files are banned by policy; only the root umbrella
      # composer.lock is committed).
      #
      # ACCEPTED-ADVISORY MECHANISM: `composer audit` has no --ignore=ID flag;
      # per-advisory exemptions live in the manifest as config.audit.ignore.
      # To accept an advisory WITH a written reason in the PR that accepts it:
      #   composer config audit.ignore --json '["GHSA-xxxx-yyyy-zzzz"]'
      # run from candy-code/ (it edits candy-code/composer.json). The audit
      # below then skips those IDs automatically. Today the array is absent —
      # nothing is pre-accepted.
      - name: Audit dependencies (candy-code — rv-sec-5)
        if: matrix.lib == 'candy-code'
        run: |
          set -euo pipefail
          cd candy-code
          AUDIT_IGNORE_SEVERITY='--ignore-severity=low --ignore-severity=medium'
          if ! composer audit --no-dev --format=summary $AUDIT_IGNORE_SEVERITY; then
            echo '::error::composer audit reported HIGH/CRITICAL advisories — table below, accept with a documented config.audit.ignore entry or bump the dep'
            composer audit --no-dev --format=table $AUDIT_IGNORE_SEVERITY || true
            exit 1
          fi

      # E671 (2026-09-10): the candy-code cell shards through
      # scripts/parallel-tests.sh instead of the 53.2-minute serial run
      # (RT-26 re-derivation 2026-11-12: the sum of the committed durations
      # table below) — the suite was the wall-clock critical path of every
      # push that touches it. K equals the runner core count,
      # capped at 4: ubuntu-latest is 2 vCPU (free tier) / 4 vCPU (paid), and
      # MEASURED contention discipline says never oversubscribe — at 2x
      # (K=8 on 4 cpus) the suite grew 1 wall-clock-race failure, at 4x it grew
      # 4 across 4 files (ProcessExecutorTest lease reap, idle-ceiling and
      # Lsp stdin-wedge; production races, tracked as a seam — never hide them
      # by raising the timeout). CI never runs a serial baseline for durations:
      # it shards from the committed scripts/parallel-tests-durations.tsv and
      # the conservation gate compares the per-shard junit sum against the
      # PINNED candy-code/tests/Config/Support/suite-figure.json. Fail-closed:
      # a test file absent from the manifest runs in zero shards, so shard-sum
      # tests < figure tests -> red; and the figure itself cannot rot, because
      # ReadmeSuiteFigureDriftTest::testArtifactIsNotStaleAgainstTheLiveEnumeration
      # re-derives `tests` LIVE from `phpunit --list-tests` inside this very
      # suite at every merge. The double lock means adding tests without
      # refreshing BOTH artifacts cannot go green. --timeout 1500 per shard:
      # the suite outgrew 600, and that era's numbers (two shards killed at
      # exactly 600s while still passing, 2026-10-06) are history. RT-26
      # (2026-11-12) re-put the tuning figures from the committed durations
      # table. THE WALL IS FLOOR-BOUND: no K ever beats the slowest single
      # file, and the LPT K=4 MAX BUCKET is what --timeout must clear, not
      # the average shard.
      # TSV-PIN tests=33094 files=2123 serial_sum=4044.9 floor=302.5 floor_file=candy-code/tests/Renderer/KeyHelpTest.php lpt_k4_max=1011.2 timeout_test=1500
      # Every value on that line is re-derived from the committed durations
      # table and suite-figure.json by tools/tests/ParallelShardTuningTest.php
      # — prose and probe drift only as far as the next red suite. 1500s is
      # ~1.5x the max legit bucket and still bounds a hung shard far under
      # the serial wall. tests= rides the figure ReadmeSuiteFigureDriftTest
      # re-derives live, so this line cannot quietly age past the trio.
      - name: Install ripgrep (candy-code)
        if: matrix.lib == 'candy-code'
        # GrepEngineDifferentialTest::parityCases() answers [] when rg is
        # absent (there is no second engine to diff); PHPUnit 10 promotes an
        # empty data provider to a suite-load ERROR, so the candy-code cell
        # was structurally dead on ubuntu-latest, which ships no ripgrep
        # (ci.yml run 39365805245, release-phar run 39371841327). Installing
        # rg runs the parity legs for real — the honest cure is never a
        # placeholder leg, and a host-side skip would hide the same void.
        # Deliberately UNPINNED while ubuntu-latest migrates 24.04 -> 26.04 (Oct-Nov 2026):
        # a version pin is only sound once runs-on names a fixed label. Verified noble string
        # for whoever lands it after that: ripgrep=14.1.0-1. Refresh cadence: candy-code/docs/CI.md.
        run: |
          set -euo pipefail
          command -v rg >/dev/null 2>&1 && exit 0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          rg --version

      - name: Run tests (candy-code — sharded, E671)
        if: matrix.lib == 'candy-code'
        run: |
          set -euo pipefail
          CORES=$(nproc)
          K=$CORES
          if [ "$K" -gt 4 ]; then K=4; fi
          echo "::notice::candy-code sharded at K=$K on $CORES-core ubuntu-latest (E671)"
          OUT="${RUNNER_TEMP:-/tmp}/parallel-tests"
          RC=0
          bash scripts/parallel-tests.sh "$K" \
            --durations scripts/parallel-tests-durations.tsv \
            --against-json candy-code/tests/Config/Support/suite-figure.json \
            --out "$OUT" --timeout 1500 || RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "sharded run failed rc=$RC (per-shard tails are printed inline by the harness)"
            exit "$RC"
          fi

      - name: Run tests (serial)
        if: matrix.lib != 'candy-code'
        env:
          MAT_LIB: ${{ matrix.lib }}
        run: php "$MAT_LIB/vendor/bin/phpunit" -c "$MAT_LIB/phpunit.xml" --colors=never

  # Windows test job — verifies Windows-native TTY paths (FFI/kernel32 paths
  # in sugar-core) pass on windows-latest. Uses a small matrix of the most
  # TTY-sensitive libs to keep wall-clock time reasonable.
  windows-test:
    name: 'Windows · PHP ${{ matrix.php }} · ${{ matrix.lib }}'
    runs-on: windows-latest
    needs: [build-matrix]
    # See the `test` job: empty matrix = hard error, so skip instead.
    if: needs.build-matrix.outputs.windows_count != '0'
    concurrency:
      group: ci-windows-${{ github.ref }}-${{ matrix.lib }}-${{ matrix.php }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.windows_matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # PHP on Windows comes with FFI enabled by default in PHP 8.3+.
      # We still declare mbstring / intl / json / pcntl explicitly so that
      # the action installs them if they are missing from the runner image.
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, json, pcntl, ffi
          tools: composer:v2
          coverage: none
          ini-values: ffi.enable=true

      # Composer cache disabled on Windows: path encoding issues in GH Actions
      # runner make the cache more trouble than it's worth.  Vendor/ caching
      # (below) handles the significant per-lib dependency layer.

      - name: Cache vendor/
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ matrix.lib }}/vendor
          key: vendor-win-v3-${{ matrix.php }}-${{ matrix.lib }}-${{ hashFiles(format('{0}/composer.json', matrix.lib)) }}
          restore-keys: |
            vendor-win-v3-${{ matrix.php }}-${{ matrix.lib }}-

      - name: Link sibling libs
        run: php tools/check-path-repos.php --fix --strict-closure

      - name: Install dependencies
        env:
          MAT_LIB: ${{ matrix.lib }}
        run: cd "$env:MAT_LIB" && composer install --prefer-dist --no-progress -n --ignore-platform-req=ext-pcntl --ignore-platform-req=ext-shmop

      # sugar-core: run TTY subsystem tests (where WindowsBackend / kernel32 FFI
      # lives).  sugar-pty: run only tests\Windows — the rest of its suite is
      # POSIX-pinned (libc FFI, /dev/ptmx, signals) and cannot pass on a
      # Windows cell; tests\Windows carries the ConPTY primitives + adapter
      # arms and skips its live legs below PHP 8.4.  Downstream libs
      # (sugar-forms, sugar-widgets, candy-scriptui, sugar-markdown): run
      # full suite — any failures there are pre-existing and
      # unrelated to the x/windows changes.
      - name: Run tests
        env:
          MAT_LIB: ${{ matrix.lib }}
        run: |
          if (Test-Path "$env:MAT_LIB\tests\Util\Tty") {
            php "$env:MAT_LIB\vendor\bin\phpunit" -c "$env:MAT_LIB\phpunit.xml" "$env:MAT_LIB\tests\Util\Tty\" --colors=never
          } elseif (Test-Path "$env:MAT_LIB\tests\Windows") {
            php "$env:MAT_LIB\vendor\bin\phpunit" -c "$env:MAT_LIB\phpunit.xml" "$env:MAT_LIB\tests\Windows\" --colors=never
          } else {
            php "$env:MAT_LIB\vendor\bin\phpunit" -c "$env:MAT_LIB\phpunit.xml" --colors=never
          }

  # macOS test job — verifies POSIX PTY paths (sugar-pty's libc FFI:
  # posix_openpt / grantpt / unlockpt / ptsname_r / ioctl + the macOS
  # TIOCSWINSZ / TIOCGWINSZ constants that diverge from Linux) work
  # on Darwin. Scoped to sugar-pty only — other libs would catch
  # macOS-specific regressions on demand if/when issues surface.
  macos-test:
    name: 'macOS · PHP ${{ matrix.php }} · ${{ matrix.lib }}'
    # macos-15 is the current stable Apple Silicon (arm64) image.
    # macos-26-intel was an Intel runner; GitHub is phasing Intel out
    # and the sugar-pty FFI / PTY syscalls hung on it past the 30-min
    # cell timeout. arm64 ships a newer macOS kernel + libSystem and
    # is the default for new repos as of late 2025.
    runs-on: macos-15
    timeout-minutes: 30
    needs: [build-matrix]
    # See the `test` job: empty matrix = hard error, so skip instead.
    if: needs.build-matrix.outputs.macos_count != '0'
    concurrency:
      group: ci-macos-${{ github.ref }}-${{ matrix.lib }}-${{ matrix.php }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, json, pcntl, ffi, :xdebug
          tools: composer:v2
          coverage: none
          ini-values: ffi.enable=true

      - name: Cache vendor/
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ matrix.lib }}/vendor
          key: vendor-mac-v3-${{ matrix.php }}-${{ matrix.lib }}-${{ hashFiles(format('{0}/composer.json', matrix.lib)) }}
          restore-keys: |
            vendor-mac-v3-${{ matrix.php }}-${{ matrix.lib }}-

      - name: Link sibling libs
        run: php tools/check-path-repos.php --fix --strict-closure

      - name: Install dependencies
        env:
          MAT_LIB: ${{ matrix.lib }}
        run: cd "$MAT_LIB" && composer install --prefer-dist --no-progress -n

      - name: List Modules
        run: php -m

      - name: Run tests
        env:
          MAT_LIB: ${{ matrix.lib }}
        run: php "$MAT_LIB/vendor/bin/phpunit" -c "$MAT_LIB/phpunit.xml" --colors=never

  # rv-devops-5 (crush-review-1014): candy-code macOS SMOKE — install, lint
  # sweep, boot. Deliberately NOT in the macos test matrix: candy-code stays
  # out of scripts/affected-libs.php's MACOS_LIBS roster (running the 22k-test
  # suite on a macOS runner is a deferred capacity decision). This job closes
  # the honest gap that decision leaves — today a Darwin-only install/boot
  # regression in the flagship app ships untested — for the price of one
  # ~3-minute runner. Independent of build-matrix on purpose: a matrix bug
  # can neither mask it nor schedule it.
  macos-smoke:
    name: 'macOS smoke · candy-code'
    runs-on: macos-15
    timeout-minutes: 15
    # Read-only checkout: this job publishes nothing.
    permissions:
      contents: read
    concurrency:
      group: ci-macos-smoke-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Same PHP shape as macos-test (the FFI/pcntl set candy-code's server
      # mode probes for); curl/openssl/git are bundled with the runner image.
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          extensions: mbstring, intl, json, pcntl, posix, ffi, :xdebug
          tools: composer:v2
          coverage: none
          ini-values: ffi.enable=true

      - name: Cache vendor/
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: candy-code/vendor
          key: vendor-mac-v3-8.3-candy-code-${{ hashFiles('candy-code/composer.json') }}
          restore-keys: |
            vendor-mac-v3-8.3-candy-code-

      - name: Link sibling libs
        run: php tools/check-path-repos.php --fix --strict-closure

      - name: Install dependencies
        run: cd candy-code && composer install --prefer-dist --no-progress -n

      # GrepEngineDifferentialTest's provider returns an empty data set when
      # the rg binary is missing — PHPUnit surfaces that as 2 errors on this
      # leg (macOS runners carry no ripgrep; the apt-get installs in the
      # Linux jobs' candy-code cells never reach Darwin). Install it so the
      # differential suite runs honestly instead of erroring on emptiness.
      - name: Install ripgrep (candy-code)
        run: brew install ripgrep

      # Parse every shipped source file, then the bin itself (no .php suffix,
      # so it is linted explicitly rather than via the find sweep).
      - name: Syntax sweep
        run: |
          set -euo pipefail
          find candy-code/src -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          php -l candy-code/bin/candy-code > /dev/null
          echo 'php -l clean across candy-code src/ and bin/'

      # `doctor` exits 1 only on a FAIL line (WARN never fails it, by design),
      # and `--help` must reach usage on a machine with no config at all.
      - name: Boot — doctor
        run: php candy-code/bin/candy-code doctor

      - name: Boot — help
        run: php candy-code/bin/candy-code --help

      # The Seatbelt backend of the sandbox seam (C-TOOL-4.b). The full suite
      # never runs on macOS, so this is the only place the generated SBPL
      # profile is exercised against a real /usr/bin/sandbox-exec. Both arms
      # of the live test are assertion-complete (refusal-or-run) and the
      # refusal arm drops the Linux-only message pin on Darwin, so a hostile
      # runner profile fails LOUD here instead of false-red-ing: any failure
      # on this leg means the profile text pinned byte-wise in SeatbeltTest
      # does not behave as claimed on real macOS.
      - name: Sandbox — Seatbelt tests
        run: cd candy-code && vendor/bin/phpunit -c phpunit.xml --filter '\(SandboxFactoryTest|SeatbeltTest)::'

      # C-TOOL-4.h: the PHP detach helper is the ONLY arms race macOS can win —
      # Darwin ships no setsid(1) with -w, so on this runner the helper arm is
      # what every detached spawn rides, and the Linux gate can only prove the
      # forced-candidate shape. These tests run it live: own-pgid leadership,
      # exit-status forwarding through pcntl_exec, 127 on a missing binary.
      # posix is on the extension list above for exactly this leg.
      - name: Containment — Darwin detach helper tests
        run: cd candy-code && vendor/bin/phpunit -c phpunit.xml --filter 'ProcessContainmentPhpSetsidTest::'

  # C-TUI-6.d Windows smoke · candy-code — the interactive layer's FIRST
  # real-OS measurement: `--version` must boot (a load-time fatal on any
  # POSIX-only constant consumed at boot fails here, not in a user shell),
  # and tests\Windows runs the three live legs — Bash over the located
  # Git-for-Windows bash.exe (verbatim quoting + the taskkill tree-kill) and
  # PtyRun over a real ConPTY allocation. PHP is pinned to 8.4 because
  # Kernel32ConPty::supported() refuses anything older, so the smoke would
  # skip its own purpose on 8.3. NOT the full suite: it carries
  # pcntl/posix/setsid legs that cannot pass on a Windows cell — the same
  # scoping law sugar-pty's matrix cell follows above. These legs are the
  # design's own risk statement: first real measurement, failures there are
  # findings, not flakes to forgive.
  candy-code-windows-smoke:
    name: 'Windows smoke · candy-code'
    runs-on: windows-latest
    timeout-minutes: 15
    # Non-blocking until the ConPTY attach is fixed. The failing assertion is
    # WindowsPtyRunSmokeTest: UpdateProcThreadAttribute(PSEUDOCONSOLE) returns
    # win32 error 87 for both the by-value and by-pointer shapes (CI run
    # 43352105554, job 131645375656). The job still runs and still reports; it
    # just no longer gates the sync. Remove this line when the test is green.
    continue-on-error: true
    # Read-only checkout: this job publishes nothing.
    permissions:
      contents: read
    concurrency:
      group: ci-windows-smoke-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Same FFI shape as the windows-test cell; 8.4 is the ConPTY floor
      # (Kernel32ConPty::supported() checks PHP_VERSION_ID), and ext-ffi is
      # what the cdef probe loads CreatePseudoConsole through. No new cdef
      # is added anywhere in candy-code — the 6.b/6.c adapters own that.
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring, intl, json, pcntl, ffi
          tools: composer:v2
          coverage: none
          ini-values: ffi.enable=true

      - name: Cache vendor/
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: candy-code/vendor
          key: vendor-win-v3-8.4-candy-code-${{ hashFiles('candy-code/composer.json') }}
          restore-keys: |
            vendor-win-v3-8.4-candy-code-

      - name: Link sibling libs
        run: php tools/check-path-repos.php --fix --strict-closure

      # Platform reqs the Windows image PHP (C:\tools\php\php.ini) simply lacks:
      # pcntl/shmop never exist on Windows PHP, and sqlite3/pdo_sqlite/gd are
      # required by the root closure (candy-code requires ext-sqlite3 +
      # ext-pdo_sqlite; sugar-image/sugar-video require ext-gd) but are not
      # enabled on the runner — F5b (run 42899773304) died in exactly this
      # composer install. The windows-test cell above carries the pcntl/shmop
      # pair; this smoke job needs all five because it installs the candy-code
      # closure rather than a single TTY lib.
      - name: Install dependencies
        run: cd candy-code && composer install --prefer-dist --no-progress -n --ignore-platform-req=ext-pcntl --ignore-platform-req=ext-shmop --ignore-platform-req=ext-sqlite3 --ignore-platform-req=ext-pdo_sqlite --ignore-platform-req=ext-gd

      - name: Boot the binary
        run: php candy-code\bin\candy-code --version

      - name: Run tests\Windows
        run: php candy-code\vendor\bin\phpunit -c candy-code\phpunit.xml candy-code\tests\Windows\ --colors=never

  # Coverage report — runs once on PHP 8.3 + pcov for every lib in the
  # matrix, uploads a per-lib clover XML to codecov with the lib slug
  # as a flag. Codecov uses the flag to surface a separate badge per
  # package on the README.
  coverage:
    name: 'Coverage · ${{ matrix.lib }}'
    runs-on: ubuntu-latest
    # Depend ONLY on build-matrix (the real matrix-data dependency). We used
    # to also `needs: [test]` so coverage waited for tests, but that had a
    # subtle side-effect: when any test matrix cell failed (fail-fast: false
    # means cells DO fail individually) GitHub marked the whole `test` job
    # failed → this job was skipped via needs-failure BEFORE its matrix could
    # expand → GitHub emitted one "skipped" placeholder check_run per
    # declared cell using the literal `name:` template, leaking the
    # unexpanded `${{ matrix.lib }}` text into the Teams notification feed.
    # Dynamic matrix only avoids the placeholder when the matrix actually
    # gets evaluated; a needs-failure skip happens earlier. Running in
    # parallel with `test` costs a few CI minutes when tests fail, but
    # eliminates the placeholder noise.
    needs: [build-matrix]
    # See the `test` job: empty matrix = hard error, so skip instead.
    if: needs.build-matrix.outputs.coverage_count != '0'
    concurrency:
      group: ci-coverage-${{ github.ref }}-${{ matrix.lib }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        lib: ${{ fromJSON(needs.build-matrix.outputs.coverage_libs) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Full history: the same "simple, robust" trade-off as
          # build-matrix. (Originally also required by the split-repo
          # Codacy mirror's splitsh-lite, removed by owner ruling
          # 2026-11-11.)
          fetch-depth: 0

      # Same extension-cache pattern as the test job (see comment there).
      - name: Compute PHP-extension cache key
        id: ext-cache
        uses: shivammathur/cache-extensions@695b1b465eba861efe67cbbc31252c27f5ed253d
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          key: php-ext-cov-v4

      - name: Restore PHP extensions
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.ext-cache.outputs.dir }}
          key: ${{ steps.ext-cache.outputs.key }}
          restore-keys: ${{ steps.ext-cache.outputs.key }}

      - name: Setup PHP (with pcov)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          # Same extension union as the test job — keeps test- and
          # coverage-job environments byte-identical.
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: pcov

      - name: Cache composer downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.composer/cache/files
          key: composer-cov-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-cov-

      # v4 — bump after the path-repo closure PR (#856). Old v3 caches were
      # made before symfony/console + symfony/process became required closure
      # for several libs (via path-repo'd sibling deps); the loose
      # `vendor-cov-<lib>-` restore-key matched any prior cache regardless of
      # composer.json hash, returning a vendor/ tree missing those classes
      # and producing 32 "Class Symfony\\Component\\Process\\Process not
      # found" errors on Coverage · candy-vcr.
      - name: Cache vendor/
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ matrix.lib }}/vendor
          key: vendor-cov-v4-${{ matrix.lib }}-${{ hashFiles(format('{0}/composer.json', matrix.lib)) }}
          restore-keys: |
            vendor-cov-v4-${{ matrix.lib }}-

      # NB: previous revisions of this workflow cached
      # `${{ matrix.lib }}/composer.json` itself with a loose restore-key,
      # which corrupted the checkout — when a prior cache hit on the
      # restore-key (prefix-only match) the older composer.json overwrote
      # the freshly-checked-out file and composer install resolved against
      # stale deps. That bug surfaced as 32 "Class Symfony\Component\..."
      # not-found errors on `Coverage · candy-vcr` (see #857/#858).
      # `composer install` already keys all per-lib reads off the
      # actions/checkout content; we don't need a separate cache for it.

      - name: Link sibling libs
        run: php tools/check-path-repos.php --fix --strict-closure

      - name: Install dependencies
        env:
          MAT_LIB: ${{ matrix.lib }}
        run: |
          set -e
          for i in 1 2 3; do
            cd "$MAT_LIB" && composer install --prefer-dist --no-progress -n && break
            echo "Composer install failed, retry $i/3 in 10s..."
            sleep 10
          done

      - name: Run tests with coverage (serial)
        if: matrix.lib != 'candy-code'
        env:
          MAT_LIB: ${{ matrix.lib }}
        run: php "$MAT_LIB/vendor/bin/phpunit" -c "$MAT_LIB/phpunit.xml" --colors=never --coverage-clover="$MAT_LIB/coverage.xml"

      # E691 (2026-09-11): candy-code coverage shards through the E671 harness
      # (same never-oversubscribe K = cores capped at 4 — 2x oversubscription
      # measured lease/idle-ceiling race failures on the test suite). Each shard
      # adds --coverage-clover via --clover; the CONSERVATION GATE runs before
      # any merge (shard junit sums vs the pinned suite-figure.json, fail-closed
      # exactly as in the test job — a shard that silently ran nothing, or a
      # test file missing from the durations manifest, dies here rather than
      # shipping a coverage report for an unproven subset). Then
      # scripts/merge-clover.php unions the per-shard clovers into
      # candy-code/coverage.xml — THE SAME PATH the serial job wrote — so the
      # Codecov upload downstream is untouched and cannot tell merged from
      # serial. test-merge-clover.php runs FIRST: a merger regression must fail
      # in seconds, not after a full-suite wall. --timeout 2400 per shard: the
      # K=4 max bucket is 1011.2s (RT-26 re-pin; machine values on the test
      # job's TSV-PIN line) and pcov overhead is up to ~2x on a slow runner —
      # shards were killed at 900s on 2026-10-05 — so 2400 still clears 2x the
      # max bucket while bounding a hung shard.
      # TUNING-REF timeout_cov=2400 pcov_multiple=2
      # The engine is still pcov (setup-php above); only the report SHAPE
      # (K files merged) changed, and merge-clover.php refuses missing or
      # malformed shard reports fail-closed.
      - name: Install ripgrep (candy-code)
        if: matrix.lib == 'candy-code'
        # Same void as the test job: without rg the GrepEngineDifferential
        # parity provider is empty and PHPUnit 10 errors the whole candy-code
        # cell at suite-load. The sharded coverage run below loads the same
        # suite, so it needs the same binary present.
        # Unpinned for the same reason as the test job's arm: the 24.04 -> 26.04
        # migration of ubuntu-latest makes a fixed apt version unsound until the
        # runner label is fixed (verified noble string: ripgrep=14.1.0-1).
        run: |
          set -euo pipefail
          command -v rg >/dev/null 2>&1 && exit 0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          rg --version

      - name: Run tests with coverage (candy-code — sharded, E691)
        if: matrix.lib == 'candy-code'
        run: |
          set -euo pipefail
          CORES=$(nproc)
          K=$CORES
          if [ "$K" -gt 4 ]; then K=4; fi
          echo "::notice::candy-code coverage sharded at K=$K on $CORES-core ubuntu-latest (E691)"
          OUT="${RUNNER_TEMP:-/tmp}/parallel-tests-cov"
          php scripts/test-merge-clover.php
          bash scripts/parallel-tests.sh "$K" \
            --durations scripts/parallel-tests-durations.tsv \
            --against-json candy-code/tests/Config/Support/suite-figure.json \
            --out "$OUT" --timeout 2400 --clover
          php scripts/merge-clover.php "$OUT" "$K" candy-code/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          # Explicit slug + a single named file → don't accidentally
          # walk the whole tree looking for other coverage reports.
          slug: detain/sugarcraft
          files: ${{ matrix.lib }}/coverage.xml
          disable_search: true
          flags: ${{ matrix.lib }}
          name: ${{ matrix.lib }}
          # Token MUST be set as a secret on detain/sugarcraft (repo or
          # environment scope) — GitHub org secrets only flow into repos
          # *inside* that org, so a sugarcraft-org-level secret won't be
          # visible to this monorepo. For a public repo the action falls
          # back to tokenless OIDC upload when the secret is empty, so
          # this still works during initial bootstrap.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      # Codacy coverage uploads removed by owner ruling 2026-11-11 (CI
      # all-green program, LANE-GB): the Codacy project write permission is
      # revoked/broken account-side. Every master run since at least Nov 7
      # fails this step with "API Error: Failed to create coverage: No Write
      # permission on Project" (the retry loop just exhausts retries against
      # a permanent account-side error). At d318017df, 50 of 63
      # Coverage-family jobs died on this step ALONE with the test suite and
      # the Codecov upload green (CI-WATCH2B §F: ~60 failed uploads). The
      # clover/coverage artifacts produced above still ship to Codecov
      # unchanged. RESTORE PATH (owner-side): re-grant CODACY_API_TOKEN
      # write access on the Codacy project, then re-add this step together
      # with the split-repo mirror and the coverage-final job — their exact
      # pre-ruling bytes are in this file at f7c517b0c.

      # (The split-repo Codacy mirror — sugarcraft/<lib> via splitsh-lite —
      # lived here; removed by the same owner ruling 2026-11-11, dead for
      # the same account-side "No Write permission on Project" reason. See
      # the Codacy note above; exact bytes at f7c517b0c.)

  # The `coverage-final` job lived here; removed by the same owner ruling
  # 2026-11-11 — it existed solely to send Codacy the matching `final` for
  # the partial uploads in the coverage job (see the Codacy note there;
  # exact bytes at f7c517b0c). Nothing in any workflow ever `needs`d it.

  # PHPStan static analysis — runs on all PHP versions after tests pass,
  # verifying type safety and catching type errors before they reach CI.
  # Only runs on libs that have a phpstan.neon file.
  phpstan:
    name: 'PHPStan ${{ matrix.php }} · ${{ matrix.lib }}'
    runs-on: ubuntu-latest
    # Depend ONLY on build-matrix — see the long comment on the `coverage`
    # job above for why dropping `needs: [test]` is what actually eliminates
    # the unexpanded `${{ matrix.* }}` placeholder check_runs.
    needs: [build-matrix]
    # See the `test` job: empty matrix = hard error, so skip instead.
    if: needs.build-matrix.outputs.phpstan_count != '0'
    concurrency:
      group: ci-phpstan-${{ github.ref }}-${{ matrix.lib }}-${{ matrix.php }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.build-matrix.outputs.phpstan_matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Compute PHP-extension cache key
        id: ext-cache
        uses: shivammathur/cache-extensions@695b1b465eba861efe67cbbc31252c27f5ed253d
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          key: php-ext-stan-v4

      - name: Restore PHP extensions
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.ext-cache.outputs.dir }}
          key: ${{ steps.ext-cache.outputs.key }}
          restore-keys: ${{ steps.ext-cache.outputs.key }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      - name: Cache composer downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.composer/cache/files
          key: composer-stan-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-stan-${{ matrix.php }}-
            composer-stan-

      - name: Cache vendor/
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ matrix.lib }}/vendor
          key: vendor-stan-v3-${{ matrix.php }}-${{ matrix.lib }}-${{ hashFiles(format('{0}/composer.json', matrix.lib)) }}
          restore-keys: |
            vendor-stan-v3-${{ matrix.php }}-${{ matrix.lib }}-

      - name: Link sibling libs
        run: php tools/check-path-repos.php --fix --strict-closure

      - name: Install dependencies
        env:
          MAT_LIB: ${{ matrix.lib }}
        run: cd "$MAT_LIB" && composer install --prefer-dist --no-progress -n

      - name: Run PHPStan
        env:
          MAT_LIB: ${{ matrix.lib }}
        run: php "$MAT_LIB/vendor/bin/phpstan" analyse --level=5 --no-progress -c "$MAT_LIB/phpstan.neon"
