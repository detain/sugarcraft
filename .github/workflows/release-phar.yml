# DST-1 — build the candy-code PHAR and publish it on a release.
#
# Triggered by pushing a tag spelled `candy-code/v*` (per-lib tagging, the
# shape the repo already uses for split sync), or manually with a tag input.
#
# REPRODUCIBILITY CAVEAT (disclosed, not solved here): the build runs
# `composer install` with the lock deliberately absent — house rule forbids
# committing per-lib composer.lock — and the `sugarcraft/*` siblings resolve
# from Packagist at their `dev-master` moving target. Two builds of the same
# tag can therefore differ byte-wise; the .sha256 published alongside each
# release names the bytes that job produced, not a rebuild guarantee. The
# build script REFUSES symlinked sibling vendors, dirty source trees, and
# detached HEADs, so a linked-mode working tree can never freeze uncommitted
# sibling code into a public artifact; the checkout below attaches HEAD to a
# named branch because the preflight demands exactly that attribution.
#
# `phar.readonly=0` is passed with `-d` to the BUILD command only. It is
# never a runtime requirement: the produced archive executes under a normal
# `php candy-code.phar` with the default readonly=On.
#
# C-SES-6.d — the release now ships six assets from ONE plain build plus a
# companion `--gz` build of the same tree: the plain candy-code.phar stays the
# ONLY self-update target (SelfUpdate::PHAR_ASSET matches the exact name; the
# gz/manifest/formula/installer additions ride beside it undisturbed), the gz
# twin is the slim transfer with its own .sha256 and signature trio,
# candy-code.phar.packages.json is the plain build's --manifest-out
# disclosure, and candy-code.rb / install.sh are the C-SES-6.c packaging
# files. Per the plan section 6.3 owner ruling the Homebrew tap push is
# DECLINED: the formula ships as a release asset only, there is no push leg
# and no new secret. RUNTIME CAVEAT, repeated in the release notes: the gz
# twin needs ext-zlib loaded to open at all.
name: Release PHAR

on:
  push:
    tags:
      - 'candy-code/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing candy-code/v* tag to build and publish'
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        # C-SES-9.d: a dispatched tag name is attacker-influenceable text and
        # `${{ }}` interpolation pastes it into the script BEFORE the shell
        # sees it — a ref containing a quote would break out of the run body.
        # Values now cross into the shell only through this step's `env:`.
        run: |
          set -euo pipefail
          if [ "$EVENT" = 'workflow_dispatch' ]; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.inputs.tag }}

      - name: Attach HEAD to the tag
        # The build's integrity preflight refuses detached HEADs (a tag
        # checkout IS detached); re-attaching the same commit to a branch
        # name keeps the artifact attributable without weakening the door.
        run: |
          set -euo pipefail
          git checkout -B phar-build "$TAG"
        env:
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, intl, sqlite3, pdo_sqlite, curl, openssl, pcntl

      - name: Install production dependencies
        run: |
          set -euo pipefail
          cd candy-code
          # A linked-mode local checkout can carry a path-repo lock; CI starts
          # from git, and the build REFUSES symlinked vendors as the second
          # line of defence against frozen sibling WIP.
          rm -f composer.lock
          composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Build the archive
        run: |
          set -euo pipefail
          # SOURCE_DATE_EPOCH pins metadata['built_at'] to the tagged commit's
          # date so rebuilds of one tag agree on the stamp (DST-1 reproducibility
          # note); the byte-level guarantee still stops at the moving dev-master
          # dependency window disclosed in this file's header.
          # C-SES-6.d: the same epoch line governs the gz twin below, so both
          # artifacts of one run carry the identical stamp. --manifest-out
          # (C-SES-6.b) writes the plain build's packages map for publication.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%cT "$TAG")"
          php -d phar.readonly=0 candy-code/tools/build-phar.php \
            --out=dist/candy-code.phar \
            --manifest-out=dist/candy-code.phar.packages.json \
            --version="$TAG"
        env:
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Build the gz twin (slim transfer asset)
        # C-SES-6.d: a second --gz build of the SAME tree (dev deps are not
        # installed until much later, so both builds share the --no-dev vendor).
        # Self-update keeps selecting the plain asset: the runtime downloads a
        # ~117 MiB archive today and the gz twin trades that transfer for a
        # runtime ext-zlib requirement, so the PLAIN copy stays the default and
        # the gz twin ships as the opt-in slim alternative named in the notes.
        # build-phar's --gz replaces --out with the compressed bytes, so the
        # asset lands at exactly dist/candy-code-gz.phar.
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%cT "$TAG")"
          php -d phar.readonly=0 candy-code/tools/build-phar.php \
            --out=dist/candy-code-gz.phar \
            --gz \
            --version="$TAG"
        env:
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Checksum
        # C-SES-5.c: the checksum runs BEFORE signing on purpose — the
        # signing step's headline artifact is a signature over THIS sidecar's
        # body, so the sidecar has to exist first. The .sha256 names the bytes
        # this job built (integrity); the trust leg is the signature below.
        # C-SES-6.d widens the same discipline to the gz twin (its own
        # sidecar, signed by its own detached leg), and renders the C-SES-6.c
        # packaging files here because the formula's SHA256 slot is exactly
        # the plain sidecar's first field — the formula and the sidecar can
        # never disagree, they are read from one file. install.sh is copied
        # into dist/ unchanged; the asset list below publishes it verbatim.
        run: |
          set -euo pipefail
          (cd dist && sha256sum candy-code.phar > candy-code.phar.sha256)
          (cd dist && sha256sum candy-code-gz.phar > candy-code-gz.phar.sha256)
          test -s dist/candy-code.phar.packages.json
          phar_sha="$(cut -d ' ' -f 1 dist/candy-code.phar.sha256)"
          php candy-code/tools/gen-homebrew-formula.php \
            --version="$TAG" --sha256="$phar_sha" --out=dist/candy-code.rb
          cp candy-code/tools/install.sh dist/install.sh
          cat dist/candy-code.phar.sha256
          cat dist/candy-code-gz.phar.sha256
        env:
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Sign the archive (pinned-key mode)
        # OPTIONAL step by design: without the SUGARCRAFT_SIGNING_KEY secret it
        # skips green and the release ships unsigned. The secret is shared
        # sugarcraft-wide — one owner keypair signs every app's phar, and each
        # app pins the public half in its own source. When the owner populates
        # the secret AND SelfUpdate::PUBLIC_KEY_BASE64 (the two halves of the
        # same Ed25519 keypair), this emits — verified against the key pinned
        # in source rather than against anything the release channel controls:
        #   - candy-code.phar.sha256.sig: a base64 detached sodium signature
        #     over the .sha256 SIDECAR BODY (a few dozen bytes, never the
        #     ~119 MiB archive). Current `self-update` verifies this leg and
        #     only then trusts the sidecar to gate the swap (C-SES-5.b).
        #   - candy-code.phar.minisig: the legacy base64 detached signature
        #     over the raw phar bytes, KEPT ADDITIVELY because candy-top and
        #     older candy-code releases verify it.
        #   - candy-code.phar.minisig.sha256: the legacy sidecar-of-the-
        #     sidecar, computed here rather than in the (now earlier) checksum
        #     step, since it can only exist after the file it names does.
        # C-SES-6.d adds the identical trio for the gz twin (over
        # candy-code-gz.phar and its own sidecar), so the slim asset carries
        # the same trust chain as the plain one, key-skipped together with it.
        # In keyless state all six are skipped together: they share this one
        # early-exit step, so the publish gate below sees no signature files.
        run: |
          set -euo pipefail
          if [ -z "${SUGARCRAFT_SIGNING_KEY:-}" ]; then
            echo "::notice::SUGARCRAFT_SIGNING_KEY secret not set — shipping unsigned (keyless state)"
            exit 0
          fi
          php -r '
            $key = base64_decode(getenv("SUGARCRAFT_SIGNING_KEY"), true);
            if ($key === false || strlen($key) !== SODIUM_CRYPTO_SIGN_SECRETKEYBYTES) {
              fwrite(STDERR, "SUGARCRAFT_SIGNING_KEY must be the base64 of the 64-byte sodium secret key\n");
              exit(1);
            }
            foreach (["candy-code.phar", "candy-code-gz.phar"] as $artifact) {
              $sig = sodium_crypto_sign_detached(file_get_contents("dist/" . $artifact), $key);
              file_put_contents("dist/" . $artifact . ".minisig", base64_encode($sig) . "\n");
              $sidecar_sig = sodium_crypto_sign_detached(file_get_contents("dist/" . $artifact . ".sha256"), $key);
              file_put_contents("dist/" . $artifact . ".sha256.sig", base64_encode($sidecar_sig) . "\n");
            }
          '
          (cd dist && sha256sum candy-code.phar.minisig > candy-code.phar.minisig.sha256)
          (cd dist && sha256sum candy-code-gz.phar.minisig > candy-code-gz.phar.minisig.sha256)
          cat dist/candy-code.phar.minisig
          cat dist/candy-code.phar.sha256.sig
          cat dist/candy-code-gz.phar.minisig
          cat dist/candy-code-gz.phar.sha256.sig
        env:
          SUGARCRAFT_SIGNING_KEY: ${{ secrets.SUGARCRAFT_SIGNING_KEY }}

      - name: Smoke — version
        run: php dist/candy-code.phar --version

      - name: Smoke — headless echo turn as JSON on a virgin HOME
        run: |
          set -euo pipefail
          fake_home="$(mktemp -d)"
          HOME="$fake_home" php dist/candy-code.phar -p 'release smoke' --output-format json > /tmp/phar-smoke.json
          php -r 'exit(json_decode(file_get_contents("/tmp/phar-smoke.json"), true) === null ? 1 : 0);'

      - name: Smoke — archive scanners are alive under phar://
        # The archive is addressed as a phar:// URI, never as a bare
        # '/x.phar/entry' path: measured on PHP 8.3.6 (this very step in run
        # 39355949075 died with ENOENT on the bare form), bare paths fail
        # is_file()/require for every caller — bin/candy-code's autoload guard
        # and PharCompatTest's stub pins document the same measurement, and the
        # phar:// URI is the only form the extension honours. It is also the
        # only form under which the step title ("under phar://") is honestly
        # exercised. Double quotes only in the php body below: it is embedded
        # in a shell single-quoted argument.
        run: |
          set -euo pipefail
          php -r '
            $phar = getenv("PHAR_PATH");
            require "phar://" . $phar . "/vendor/autoload.php";
            $tools = \SugarCraft\Code\Tools\Catalog\ToolCatalog::names();
            $specs = \SugarCraft\Code\Commands\Specs\BuiltInCommands::all();
            if (count($tools) === 0 || count($specs) === 0) {
              fwrite(STDERR, "phar scanner census empty: tools=" . count($tools) . " specs=" . count($specs) . "\n");
              exit(1);
            }
            echo "phar scanners alive: " . count($tools) . " tools, " . count($specs) . " specs\n";
          '
        env:
          PHAR_PATH: ${{ github.workspace }}/dist/candy-code.phar

      - name: Install ripgrep for the heavy arm
        # The phpunit invocation below loads the WHOLE suite's data providers
        # before filtering; GrepEngineDifferentialTest::parityCases() answers
        # [] when rg is absent and PHPUnit 10 promotes an empty data set to a
        # suite-load ERROR — this step died 2F/2E on run 39371841327 at
        # exactly that pair. ubuntu-latest ships no ripgrep, and the runner
        # already installed the dev vendor from apt-adjacent network above, so
        # installing rg here is no new privilege class. The parity legs then
        # run for real (the cure is never a placeholder data leg).
        run: |
          set -euo pipefail
          command -v rg >/dev/null 2>&1 && exit 0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          rg --version

      - name: PharCompatTest heavy arm
        # The archive is real; run the suite's CANDY_CODE_PHAR-gated stage 4
        # against it (the docblock at PharCompatTest promises this workflow
        # "builds an archive, exports CANDY_CODE_PHAR, and runs this file" —
        # this step is what makes that sentence true). Dev dependencies are
        # installed only now: the artifact above was built from the --no-dev
        # vendor, and re-running install does not touch dist/.
        run: |
          set -euo pipefail
          cd candy-code
          composer install --prefer-dist --no-interaction --no-progress
          CANDY_CODE_PHAR="${GITHUB_WORKSPACE}/dist/candy-code.phar" vendor/bin/phpunit --no-coverage --filter PharCompatTest

      # Deliberately NO upload-artifact step: nothing consumes a run artifact
      # (single job, no needs:, and the Publish step below ships
      # dist/candy-code.phar and its .sha256 directly as release assets), and
      # deriving an artifact name from the tag carries the namespace '/' that
      # upload-artifact refuses — run 39379594999 died on exactly that. If a
      # future job ever needs the archive, add a sanitized name here
      # (steps.tag output stripped of the `candy-code/` prefix), never the raw tag.
      - name: Publish GitHub release
        # C-SES-6.d: the asset set grows to the gz twin, the manifest, the
        # rendered formula and the installer. The self-update selector matches
        # asset names exactly (SelfUpdate::PHAR_ASSET), so none of the new
        # names disturb the plain leg. The plan section 6.3 owner ruling
        # DECLINED the Homebrew tap: candy-code.rb ships as a release asset
        # ONLY — no tap push leg, no new secret. Consumers add it with
        # `brew install --formula <download-url>` or vendor it themselves.
        run: |
          set -euo pipefail
          tag="$TAG"
          assets=(
            dist/candy-code.phar dist/candy-code.phar.sha256
            dist/candy-code-gz.phar dist/candy-code-gz.phar.sha256
            dist/candy-code.phar.packages.json
            dist/candy-code.rb dist/install.sh
          )
          if [ -f dist/candy-code.phar.minisig ]; then
            assets+=(
              dist/candy-code.phar.minisig dist/candy-code.phar.minisig.sha256 dist/candy-code.phar.sha256.sig
              dist/candy-code-gz.phar.minisig dist/candy-code-gz.phar.minisig.sha256 dist/candy-code-gz.phar.sha256.sig
            )
          fi
          # The ext-zlib caveat is the plan's named risk for the gz asset and
          # belongs in the notes a downloader reads, not only in this file.
          notes="Self-contained candy-code PHAR built by .github/workflows/release-phar.yml at commit ${GITHUB_SHA}.\n\nPlain (self-update target): candy-code.phar — Verify: sha256sum -c candy-code.phar.sha256 — Run: php candy-code.phar --version\n\nSlim twin: candy-code-gz.phar (own .sha256/signatures) — REQUIRES the ext-zlib PHP extension at RUNTIME to open; php -m | grep -i zlib before choosing it.\n\nAlso attached: candy-code.phar.packages.json (build manifest), install.sh (fetch-and-verify installer), candy-code.rb (Homebrew formula, release asset only — no tap is published)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "candy-code ${tag#candy-code/}" --verify-tag --notes "$(printf '%b' "$notes")"
          fi
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
