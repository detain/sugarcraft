name: Sync to sugarcraft org

# Pushes changed lib/app subdirs to their sibling sugarcraft/<lib> repo,
# and pushes docs/ to sugarcraft/sugarcraft.github.io. Treats this
# monorepo as the source of truth.
#
# Only libs whose source/tests/config changed (or whose deps changed)
# are pushed — same affected-libs logic as ci.yml. Monorepo-wide changes
# (workflow files, root composer) push everything.
#
# Auth: SUGARCRAFT_SYNC_TOKEN secret — a PAT with `repo` scope on
# the sugarcraft org. Without it, all push steps will 403.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: sync-sugarcraft
  cancel-in-progress: false

jobs:
  # G6-P (OD-6/OD-7, reviews-1103): nothing publishes on untested bytes.
  # Both split publishers below now need this gate, which waits for the CI
  # workflow run AT THE PUSHED COMMIT and refuses anything not green. The
  # push trigger stays (the affected-range math needs github.event.before,
  # which a workflow_run trigger would lose); the gate makes the push event
  # a WAITER on CI, not a bypass of it. A manual workflow_dispatch gates on
  # CI green at the dispatch SHA the same way — an untested head after a
  # force-push simply waits until CI covers it (or fails closed).
  ci-gate:
    name: 'Gate: CI green at the pushed commit'
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - name: CI-green door (OD-7)
        # Bounded poll for the CI workflow run AT THE PUSHED COMMIT — green
        # only. Fail-closed on every non-green shape: a completed red run is
        # fatal immediately, a missing or still-running CI is retried until
        # the attempt budget burns out and REFUSES the sync.
        run: |
          set -euo pipefail
          for attempt in $(seq 1 960); do
            run_line="$(gh run list --workflow CI --branch master --commit "$TARGET_SHA" \
              --limit 5 --json status,conclusion \
              --jq '[.[] | select(.status == "completed")] | if length == 0 then "PENDING" else (first(.[]) | .conclusion) end')"
            if [ "$run_line" = 'success' ]; then
              echo "CI is green at $TARGET_SHA — syncing"
              exit 0
            fi
            case "$run_line" in
              PENDING)
                echo "CI at $TARGET_SHA not concluded yet (attempt $attempt/960)"
                ;;
              *)
                echo "refusing sync: CI at $TARGET_SHA concluded '$run_line'" >&2
                exit 1
                ;;
            esac
            # 15s ticks × 960 attempts = the same 4h wall budget as the old
            # 60s × 240; the tax after CI flips green is now ≤15s, not ≤60s.
            # Do not coarsen: OD-7 fail-close semantics ride this loop.
            sleep 15
          done
          echo "refusing sync: no green CI at $TARGET_SHA within the poll budget (fail-closed)" >&2
          exit 1
        env:
          TARGET_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job carries no actions/checkout, so gh cannot infer the repo
          # from a git context and dies with "failed to determine base repo".
          # GH_REPO gives every gh call here its target explicitly.
          GH_REPO: detain/sugarcraft

  channel-freshness:
    name: 'Probe: published channel echoes repo bytes'
    runs-on: ubuntu-latest
    # candy-starter-001 (CS-01): the sync channel to sugarcraft/candy-starter,
    # Packagist and the docs site went silent on 2026-11-03 and nobody on the
    # repo side noticed — newcomers installed the stale public copy. This job
    # measures the live surfaces against HEAD bytes on every push. It runs
    # ADVISORY (--advisory prints FAIL, exits 0) while owner gate OG-1
    # (republish current green bytes) is open, so the known-stalled channel
    # does not red every unrelated push; the flip to fail-closed is to drop
    # the flag in the same commit that clears OG-1. Independent of ci-gate:
    # it measures, it does not publish.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Published-channel freshness probe (advisory until OG-1 lands)
        run: php tools/check-published-channel.php --advisory

  sync-libs:
    name: Split-push affected libs to sugarcraft/<lib>
    runs-on: ubuntu-latest
    needs: ci-gate   # G6-P OD-7: publish only from a tested commit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # splitsh-lite needs full history to compute the subtree split

      - name: Compute affected libs
        id: affected
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Same affected-libs logic as ci.yml: changed libs + transitive
          # dependents over the whole push (before..sha), not just its last
          # commit — a multi-commit push touching lib A then lib B must sync
          # both. A dispatch, a new branch (zero before-sha) or a before-sha
          # missing from history (force-push) falls back to HEAD~1..HEAD,
          # whose script output still flags monorepo-wide files as force_all.
          ZERO=0000000000000000000000000000000000000000
          range="HEAD~1..HEAD"
          if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "$ZERO" ] \
             && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="${BEFORE_SHA}..${HEAD_SHA}"
          fi
          echo "affected-libs range: $range"
          # stdout ONLY: the script prints its one-line summary on stderr, and
          # folding that into the JSON (2>&1) made every parse fail — which
          # fell back to force_all and pushed all libs on every sync.
          # stderr still reaches the job log.
          result=$(php scripts/affected-libs.php --range "$range")
          # A parse failure still fails SAFE (push everything), never silent.
          affected=$(echo "$result" | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(d['affected']))" || true)
          force_all=$(echo "$result" | python3 -c "import json,sys; d=json.load(sys.stdin); print('yes' if d['force_all'] else 'no')" || echo "yes")
          echo "force_all=$force_all"
          echo "affected_libs=$affected"
          # One space-separated line: a multi-line value is not a valid
          # name=value GITHUB_OUTPUT entry.
          echo "affected_libs=$affected" >> "$GITHUB_OUTPUT"
          echo "force_all=$force_all" >> "$GITHUB_OUTPUT"

      - name: Configure git identity + drop checkout's auth header
        run: |
          git config user.name  'Joe Huss'
          git config user.email 'detain@interserver.net'
          git config --local --unset-all http.https://github.com/.extraheader || true

      # splitsh-lite v1.0.1 output is deterministic for a given prefix set: the
      # same monorepo HEAD plus the same single --prefix always yields the same
      # split SHA (verified against the live sugarcraft/* masters in
      # prompt_kit/briefs/rename-2.1/REPORT.md §3). It is NOT equal to
      # `git subtree split` output — the two diverge mid-history on this repo
      # (different merge-commit handling), so nothing may substitute subtree
      # here: the SHA this workflow pushes is the splitsh-lite SHA.
      # A split tracks exactly one directory path and does NOT follow a dir
      # rename (rename-2.1 REPORT §4–5): after a `git mv <old> <new>` from a
      # tools/renames.json batch, the new prefix's split is an unrelated fresh
      # root, so the loop below preserves the remote's pre-rename master under
      # legacy/<old-slug> + <old-slug>-final before the first force-push.
      # Within a single run splitsh-lite keeps an in-process commit cache
      # (.git/splitsh.db) shared across invocations, so the first lib pays the
      # full history walk and the remaining libs are near-instant.
      #
      # We deliberately do NOT persist .git/splitsh.db across runs via
      # actions/cache: splitsh-lite opens the BoltDB cache read-write, and a
      # cache-restored db is not reliably writable on the runner, which makes
      # splitsh-lite abort instantly with "open .git/splitsh.db: permission
      # denied". The ~30s a warm cache would save is not worth that fragility.
      - name: Install splitsh-lite
        run: |
          set -euo pipefail
          url="https://github.com/splitsh/lite/releases/download/v1.0.1/lite_linux_amd64.tar.gz"
          expected="ec46c5a409422bf55b26f7de1faab67c2320362934947f984872b3aedc4a9d99"
          curl -fsSL "$url" -o /tmp/splitsh.tar.gz
          tar -xzf /tmp/splitsh.tar.gz -C /tmp ./splitsh-lite
          echo "$expected  /tmp/splitsh-lite" | sha256sum -c -
          chmod +x /tmp/splitsh-lite
          /tmp/splitsh-lite --version

      - name: Split + force-push each affected lib
        env:
          TOKEN: ${{ secrets.SUGARCRAFT_SYNC_TOKEN }}
          # gh auth for the ensure_repo preflight below — same secret the
          # push already carries, so a new lib's first sync creates its
          # split repo instead of burning the 3-retry loop on a 404.
          GH_TOKEN: ${{ secrets.SUGARCRAFT_SYNC_TOKEN }}
          FORCE_ALL: ${{ steps.affected.outputs.force_all }}
          AFFECTED_LIBS: ${{ steps.affected.outputs.affected_libs }}
          # Packagist auto-update: a sugarcraft/<lib> split repo only re-crawls
          # on Packagist if it carries the per-repo Packagist webhook, and a
          # FRESHLY-CREATED split repo starts WITHOUT it — which is how several
          # libs (sugar-cellbuffer, sugar-forms, sugar-focus, sugar-gallery, …)
          # silently stopped auto-updating, forcing a manual "Update" on
          # packagist.org. To make the system self-healing, we ALSO ping
          # Packagist's update-package API for every lib we push here, so a
          # missing/misconfigured webhook can never strand a package on a stale
          # dev-master again. Non-fatal: a package not yet registered on
          # Packagist (new lib) just logs a non-200 and the sync continues.
          PACKAGIST_USERNAME: detain
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          set -euo pipefail

          # RT-33: the split/site remotes used to carry the token INSIDE the
          # URL. That form persists credentials into every cloned .git/config
          # and shows the secret in child-process argv while each push runs.
          # GIT_ASKPASS hands git the same basic-auth pair at auth time
          # instead: remote URLs stay credential-free and no on-disk config
          # ever holds the token (the step's TOKEN env var is what the helper
          # echoes).
          git_askpass=$(mktemp)
          {
            echo '#!/bin/sh'
            echo '[ -n "${TOKEN:-}" ] || { echo "GIT_ASKPASS: TOKEN env is unset - refusing to answer auth" >&2; exit 1; }'
            echo 'case "$1" in'
            echo '  *sername*) printf "x-access-token\n" ;;'
            echo '  *)         printf "%s\n" "$TOKEN" ;;'
            echo 'esac'
          } >"$git_askpass"
          chmod 700 "$git_askpass"
          export GIT_ASKPASS="$git_askpass"

          # Retry function for git push operations with exponential backoff
          retry_git_push() {
            local max_attempts=3
            local delay=5
            local attempt=1
            while (( attempt <= max_attempts )); do
              if "$@"; then
                return 0
              fi
              echo "Push failed (attempt $attempt/$max_attempts), waiting ${delay}s..." >&2
              sleep $delay
              ((attempt++))
              delay=$((delay * 2))
            done
            echo "Push failed after $max_attempts attempts" >&2
            return 1
          }

          # tools/renames.json is the authoritative old->new map (plan_rename.md
          # Part C). Print the pre-rename slug when the lib dir $1 is a rename
          # target; empty otherwise. FAILS CLOSED (exit 1) on a missing/corrupt
          # map or a duplicate `new` claim: an empty answer here silently skips
          # legacy preservation, so an unreadable map must abort the whole sync
          # step (set -e) rather than let renamed libs force-push uninspected.
          # The splitsh-lite invocation below must stay SINGLE-prefix — two
          # plain --prefix flags are a hard parse error in v1.0.1 and never
          # preserved continuity anyway (measured in
          # prompt_kit/briefs/rename-2.1/REPORT.md §4, §8), so the map's only
          # use here is naming the legacy preservation refs below.
          old_slug_for() {
            php -r '
              if (!is_file("tools/renames.json")) {
                fwrite(STDERR, "old_slug_for: tools/renames.json is missing — refusing to sync uninspected\n");
                exit(1);
              }
              $map = json_decode((string) file_get_contents("tools/renames.json"), true);
              if (!is_array($map) || !isset($map["entries"]) || !is_array($map["entries"])) {
                fwrite(STDERR, "old_slug_for: tools/renames.json is not a valid renames map — refusing to sync uninspected\n");
                exit(1);
              }
              $matches = [];
              foreach ($map["entries"] as $e) {
                if (($e["kind"] ?? "") !== "rename" || ($e["old"] ?? null) === null) continue;
                if (($e["new"] ?? null) === $argv[1]) $matches[] = $e["old"];
              }
              if (count($matches) > 1) {
                fwrite(STDERR, "old_slug_for: " . count($matches) . " rename entries claim new slug {$argv[1]} (" . implode(", ", $matches) . ") — refusing to guess\n");
                exit(1);
              }
              echo $matches[0] ?? "";
            ' "$1"
          }

          # First-sync preflight (RT-06): the split push used to fail three
          # retries + red for any lib whose sugarcraft/<lib> repo did not
          # exist yet — org provisioning was a manual bootstrap script only
          # an admin could run. Now the sync self-heals: view → create with
          # the lib's composer.json description (metadata SSOT, same source
          # bootstrap-org-repos.sh resolves) → same topics bootstrap sets.
          # If creation itself fails (token without admin on the org),
          # refuse LOUD naming the lib and the manual path — never let the
          # retry loop stand in for a missing repo.
          ensure_repo() {
            local lib="$1"
            if gh repo view "$ORG/$lib" >/dev/null 2>&1; then
              return 0
            fi
            echo "ensure_repo: sugarcraft/$lib missing — auto-creating (first sync of this lib)"
            desc="$(php -r '$j = json_decode(file_get_contents($argv[1]), true); echo $j["description"] ?? "";' "$lib/composer.json" 2>/dev/null || true)"
            create_args=(repo create "$ORG/$lib" --public --homepage "https://sugarcraft.github.io/lib/$lib.html")
            if [ -n "$desc" ]; then
              create_args+=(--description "$desc")
            fi
            if ! gh "${create_args[@]}"; then
              echo "ensure_repo: cannot create sugarcraft/$lib — grant SUGARCRAFT_SYNC_TOKEN admin on the org, or run scripts/bootstrap-org-repos.sh as an org admin" >&2
              exit 1
            fi
            gh api -X PUT "/repos/$ORG/$lib/topics" \
              -F "names[]=php" -F "names[]=tui" -F "names[]=terminal" \
              -F "names[]=sugarcraft" -F "names[]=composer" \
              -H "Accept: application/vnd.github.mercy-preview+json" >/dev/null || true
          }

          force_all="$FORCE_ALL"
          libs_str="$AFFECTED_LIBS"
          ORG="sugarcraft"

          if [ "$force_all" = "yes" ]; then
            # Monorepo-wide change: push all libs
            echo "force_all=yes — pushing all libs"
            mapfile -t libs < <(php scripts/affected-libs.php --all 2>/dev/null | python3 -c "import json,sys; print('\n'.join(json.load(sys.stdin)['all_libs']))")
            # An empty force-all list means affected-libs.php (or php) failed — a
            # process-sub failure can't trip `set -e`, so fail loudly here rather
            # than silently "syncing" zero libs and reporting success.
            if [ "${#libs[@]}" -eq 0 ]; then
              echo "force_all but lib list is empty — affected-libs.php --all produced nothing" >&2
              exit 1
            fi
          else
            # Changed-only: push only affected libs
            echo "Pushing affected libs:"
            echo "$libs_str"
            read -r -a libs <<<"$libs_str"
          fi

          # RT-27: the publish wave was fully serial — one blocking force-push
          # plus one blocking (--max-time 20) Packagist ping per lib, across
          # ~60 independent repos; a degraded packagist.org taxed the publish
          # path 20s×N behind the ci-gate. Now: phase 1 computes every split
          # SHA serially (ensure_repo's fail-loud creation preflight stays
          # AHEAD of the wave — the parallel push must never race a missing
          # repo), phase 2 fans the pushes out bounded (xargs -P 8) with the
          # rename-continuity guards kept verbatim and fail-closed per worker,
          # phase 3 drains the best-effort pings after the push wave. The step
          # rc is unchanged in kind: every lib landed or the job is red, and
          # the red names the libs.
          base="${SPLIT_BASE_URL:-https://github.com/sugarcraft}"
          plan=$(mktemp)
          pushdir=$(mktemp -d)
          for lib in "${libs[@]}"; do
            [ -d "$lib" ] || { echo "skip $lib (no dir)"; continue; }
            ensure_repo "$lib"
            # splitsh-lite prints the split-commit SHA for the prefix on stdout.
            sha=$(/tmp/splitsh-lite --prefix="$lib")
            # Rename continuity (step 2.1 verdict NOT-CONTINUOUS fallback):
            # when this dir was produced by a `git mv <old> <new>`, the split
            # has a fresh unrelated root, so the remote master still holds the
            # only copy of the pre-rename split history. The lookup is
            # immediate-predecessor only: chained renames (A->B->C) preserve
            # the A-era remote chain as legacy/B — history survives by
            # reference, the ref name marks the hop, not the era. Non-renamed
            # libs answer empty, so the worker below never touches the network
            # for the guard (one local old_slug_for lookup per lib in phase 1,
            # zero extra network calls).
            prev=$(old_slug_for "$lib")
            printf '%s|%s|%s|%s|%s\n' "$lib" "$sha" "$prev" "$base" "$pushdir" >>"$plan"
          done

          push_one() {
            # spec: lib|sha|prev — runs as its own bash via xargs, so
            # everything it needs is either in the spec, the env, or an arg.
            set -euo pipefail
            local spec="$1" lib sha prev base pushdir push_url remote_tip
            IFS='|' read -r lib sha prev base pushdir <<<"$spec"
            push_url="$base/$lib.git"
            if [ -n "$prev" ]; then
              # Deliberately no `|| true` on ls-remote: a truly empty repo
              # answers rc=0/empty, so a non-zero exit is an auth/network
              # error that must NOT masquerade as "nothing to preserve" —
              # fail closed, never force-push over an uninspected master.
              remote_tip=$(git ls-remote "$push_url" refs/heads/master | cut -f1)
              if [ -n "$remote_tip" ]; then
                git fetch --quiet "$push_url" "$remote_tip"
                if ! git merge-base --is-ancestor "$remote_tip" "$sha"; then
                  echo "! $lib: pre-rename master $remote_tip is not an ancestor of $sha — preserving legacy/$prev"
                  retry_git_push git push "$push_url" "$remote_tip:refs/heads/legacy/$prev"
                  retry_git_push git push "$push_url" "$remote_tip:refs/tags/$prev-final"
                fi
              fi
            fi
            retry_git_push git push --force "$push_url" "$sha:refs/heads/master"
            : >"$pushdir/$lib.ok"
            echo "✓ synced $lib ($sha)"
          }
          export -f push_one retry_git_push

          push_rc=0
          xargs -a "$plan" -d '\n' -P 8 -n 1 bash -c 'push_one "$1"' _ || push_rc=$?
          # Collection is roster-driven, not xargs-rc-driven: a worker killed
          # sideways (no .ok file) fails closed even if xargs shrugged.
          failed=()
          while IFS='|' read -r lib _rest; do
            [ -f "$pushdir/$lib.ok" ] || failed+=("$lib")
          done <"$plan"
          if [ "$push_rc" -ne 0 ] || [ "${#failed[@]}" -gt 0 ]; then
            printf 'split push FAILED for: %s\n' "${failed[*]}" >&2
            exit 1
          fi

          # Belt-and-suspenders Packagist re-crawl (see env note above).
          # Auth channel note (RT-09, 2026-11-12): packagist's documented
          # update-package contract takes username/apiToken as QUERY
          # PARAMETERS, so the token rides the URL by design here. The
          # compensating control is GitHub Actions secret masking: the
          # PACKAGIST_API_TOKEN value is masked in all step logs and argv
          # is not logged; the local scripts/packagist.sh twin of this call
          # additionally keeps the URL out of argv via `curl -K -`.
          # Guarded on the token so a fork/secret-less run skips it cleanly;
          # the `|| echo 000` keeps a transient Packagist hiccup from failing
          # the whole sync (the per-repo webhook is still the primary path).
          # RT-27 moved the drain AFTER the push wave so pings overlap each
          # other instead of serializing behind every push.
          if [ -n "${PACKAGIST_TOKEN:-}" ]; then
            ping_one() {
              # spec: lib|base — xargs children never see the parent's
              # locals, so the repo URL is carried in the spec (same law as
              # push_one above).
              local spec="$1" lib base code
              IFS='|' read -r lib base <<<"$spec"
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -XPOST \
                -H 'content-type: application/json' \
                "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
                -d "{\"repository\":{\"url\":\"$base/$lib\"}}" || echo "000")
              echo "  ↳ packagist update $lib → HTTP $code"
            }
            export -f ping_one
            cut -d'|' -f1 "$plan" | while IFS= read -r l; do printf '%s|%s\n' "$l" "$base"; done \
              | xargs -d '\n' -P 8 -n 1 bash -c 'ping_one "$1"' _ || true
          fi
          echo "Done — $(wc -l <"$plan") libs pushed"

  sync-site:
    name: Push docs/ to sugarcraft/sugarcraft.github.io
    runs-on: ubuntu-latest
    needs: ci-gate   # G6-P OD-7: publish only from a tested commit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Mirror docs/ → sugarcraft.github.io master
        env:
          TOKEN: ${{ secrets.SUGARCRAFT_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          # RT-33: the split/site remotes used to carry the token INSIDE the
          # URL. That form persists credentials into every cloned .git/config
          # and shows the secret in child-process argv while each push runs.
          # GIT_ASKPASS hands git the same basic-auth pair at auth time
          # instead: remote URLs stay credential-free and no on-disk config
          # ever holds the token (the step's TOKEN env var is what the helper
          # echoes).
          git_askpass=$(mktemp)
          {
            echo '#!/bin/sh'
            echo '[ -n "${TOKEN:-}" ] || { echo "GIT_ASKPASS: TOKEN env is unset - refusing to answer auth" >&2; exit 1; }'
            echo 'case "$1" in'
            echo '  *sername*) printf "x-access-token\n" ;;'
            echo '  *)         printf "%s\n" "$TOKEN" ;;'
            echo 'esac'
          } >"$git_askpass"
          chmod 700 "$git_askpass"
          export GIT_ASKPASS="$git_askpass"

          # Retry function for git push operations with exponential backoff
          retry_git_push() {
            local max_attempts=3
            local delay=5
            local attempt=1
            while (( attempt <= max_attempts )); do
              if "$@"; then
                return 0
              fi
              echo "Push failed (attempt $attempt/$max_attempts), waiting ${delay}s..." >&2
              sleep $delay
              ((attempt++))
              delay=$((delay * 2))
            done
            echo "Push failed after $max_attempts attempts" >&2
            return 1
          }

          tmp=$(mktemp -d)
          git clone --quiet \
            "https://github.com/sugarcraft/sugarcraft.github.io.git" \
            "$tmp/site"
          # docs/old and docs/research are repo working documents, not site content:
          # drop any copy already published so --delete removes them from the site.
          rm -rf "$tmp/site/old" "$tmp/site/research"
          rsync -a --delete --exclude=.git --exclude=/old/ --exclude=/research/ ./docs/ "$tmp/site/"
          cd "$tmp/site"
          git config user.name  'Joe Huss'
          git config user.email 'detain@interserver.net'
          git add -A
          if git diff --cached --quiet; then
            echo "site already in sync"
            exit 0
          fi
          git commit --quiet -m "Sync from monorepo @ ${GITHUB_SHA:0:7}"
          retry_git_push git push --quiet origin master
          echo "✓ pushed site update"
