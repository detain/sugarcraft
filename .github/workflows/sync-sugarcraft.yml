name: Sync to sugarcraft org

# Pushes changed lib/app subdirs to their sibling sugarcraft/<lib> repo,
# and pushes docs/ to sugarcraft/sugarcraft.github.io. Treats this
# monorepo as the source of truth.
#
# Only libs whose source/tests/config changed (or whose deps changed)
# are pushed — same affected-libs logic as ci.yml. Monorepo-wide changes
# (workflow files, root composer) push everything.
#
# Auth: SUGARCRAFT_SYNC_TOKEN secret — a PAT with `repo` scope on
# the sugarcraft org. Without it, all push steps will 403.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: sync-sugarcraft
  cancel-in-progress: false

jobs:
  sync-libs:
    name: Split-push affected libs to sugarcraft/<lib>
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # splitsh-lite needs full history to compute the subtree split

      - name: Compute affected libs
        id: affected
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Same affected-libs logic as ci.yml: changed libs + transitive
          # dependents over the whole push (before..sha), not just its last
          # commit — a multi-commit push touching lib A then lib B must sync
          # both. A dispatch, a new branch (zero before-sha) or a before-sha
          # missing from history (force-push) falls back to HEAD~1..HEAD,
          # whose script output still flags monorepo-wide files as force_all.
          ZERO=0000000000000000000000000000000000000000
          range="HEAD~1..HEAD"
          if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "$ZERO" ] \
             && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="${BEFORE_SHA}..${HEAD_SHA}"
          fi
          echo "affected-libs range: $range"
          # stdout ONLY: the script prints its one-line summary on stderr, and
          # folding that into the JSON (2>&1) made every parse fail — which
          # fell back to force_all and pushed all libs on every sync.
          # stderr still reaches the job log.
          result=$(php scripts/affected-libs.php --range "$range")
          # A parse failure still fails SAFE (push everything), never silent.
          affected=$(echo "$result" | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(d['affected']))" || true)
          force_all=$(echo "$result" | python3 -c "import json,sys; d=json.load(sys.stdin); print('yes' if d['force_all'] else 'no')" || echo "yes")
          echo "force_all=$force_all"
          echo "affected_libs=$affected"
          # One space-separated line: a multi-line value is not a valid
          # name=value GITHUB_OUTPUT entry.
          echo "affected_libs=$affected" >> "$GITHUB_OUTPUT"
          echo "force_all=$force_all" >> "$GITHUB_OUTPUT"

      - name: Configure git identity + drop checkout's auth header
        run: |
          git config user.name  'Joe Huss'
          git config user.email 'detain@interserver.net'
          git config --local --unset-all http.https://github.com/.extraheader || true

      # splitsh-lite v1.0.1 output is deterministic for a given prefix set: the
      # same monorepo HEAD plus the same single --prefix always yields the same
      # split SHA (verified against the live sugarcraft/* masters in
      # prompt_kit/briefs/rename-2.1/REPORT.md §3). It is NOT equal to
      # `git subtree split` output — the two diverge mid-history on this repo
      # (different merge-commit handling), so nothing may substitute subtree
      # here: the SHA this workflow pushes is the splitsh-lite SHA.
      # A split tracks exactly one directory path and does NOT follow a dir
      # rename (rename-2.1 REPORT §4–5): after a `git mv <old> <new>` from a
      # tools/renames.json batch, the new prefix's split is an unrelated fresh
      # root, so the loop below preserves the remote's pre-rename master under
      # legacy/<old-slug> + <old-slug>-final before the first force-push.
      # Within a single run splitsh-lite keeps an in-process commit cache
      # (.git/splitsh.db) shared across invocations, so the first lib pays the
      # full history walk and the remaining libs are near-instant.
      #
      # We deliberately do NOT persist .git/splitsh.db across runs via
      # actions/cache: splitsh-lite opens the BoltDB cache read-write, and a
      # cache-restored db is not reliably writable on the runner, which makes
      # splitsh-lite abort instantly with "open .git/splitsh.db: permission
      # denied". The ~30s a warm cache would save is not worth that fragility.
      - name: Install splitsh-lite
        run: |
          set -euo pipefail
          url="https://github.com/splitsh/lite/releases/download/v1.0.1/lite_linux_amd64.tar.gz"
          expected="ec46c5a409422bf55b26f7de1faab67c2320362934947f984872b3aedc4a9d99"
          curl -fsSL "$url" -o /tmp/splitsh.tar.gz
          tar -xzf /tmp/splitsh.tar.gz -C /tmp ./splitsh-lite
          echo "$expected  /tmp/splitsh-lite" | sha256sum -c -
          chmod +x /tmp/splitsh-lite
          /tmp/splitsh-lite --version

      - name: Split + force-push each affected lib
        env:
          TOKEN: ${{ secrets.SUGARCRAFT_SYNC_TOKEN }}
          FORCE_ALL: ${{ steps.affected.outputs.force_all }}
          AFFECTED_LIBS: ${{ steps.affected.outputs.affected_libs }}
          # Packagist auto-update: a sugarcraft/<lib> split repo only re-crawls
          # on Packagist if it carries the per-repo Packagist webhook, and a
          # FRESHLY-CREATED split repo starts WITHOUT it — which is how several
          # libs (candy-buffer, candy-forms, sugar-focus, sugar-gallery, …)
          # silently stopped auto-updating, forcing a manual "Update" on
          # packagist.org. To make the system self-healing, we ALSO ping
          # Packagist's update-package API for every lib we push here, so a
          # missing/misconfigured webhook can never strand a package on a stale
          # dev-master again. Non-fatal: a package not yet registered on
          # Packagist (new lib) just logs a non-200 and the sync continues.
          PACKAGIST_USERNAME: detain
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          set -euo pipefail

          # Retry function for git push operations with exponential backoff
          retry_git_push() {
            local max_attempts=3
            local delay=5
            local attempt=1
            while (( attempt <= max_attempts )); do
              if "$@"; then
                return 0
              fi
              echo "Push failed (attempt $attempt/$max_attempts), waiting ${delay}s..." >&2
              sleep $delay
              ((attempt++))
              delay=$((delay * 2))
            done
            echo "Push failed after $max_attempts attempts" >&2
            return 1
          }

          # tools/renames.json is the authoritative old->new map (plan_rename.md
          # Part C). Print the pre-rename slug when the lib dir $1 is a rename
          # target; empty otherwise. FAILS CLOSED (exit 1) on a missing/corrupt
          # map or a duplicate `new` claim: an empty answer here silently skips
          # legacy preservation, so an unreadable map must abort the whole sync
          # step (set -e) rather than let renamed libs force-push uninspected.
          # The splitsh-lite invocation below must stay SINGLE-prefix — two
          # plain --prefix flags are a hard parse error in v1.0.1 and never
          # preserved continuity anyway (measured in
          # prompt_kit/briefs/rename-2.1/REPORT.md §4, §8), so the map's only
          # use here is naming the legacy preservation refs below.
          old_slug_for() {
            php -r '
              if (!is_file("tools/renames.json")) {
                fwrite(STDERR, "old_slug_for: tools/renames.json is missing — refusing to sync uninspected\n");
                exit(1);
              }
              $map = json_decode((string) file_get_contents("tools/renames.json"), true);
              if (!is_array($map) || !isset($map["entries"]) || !is_array($map["entries"])) {
                fwrite(STDERR, "old_slug_for: tools/renames.json is not a valid renames map — refusing to sync uninspected\n");
                exit(1);
              }
              $matches = [];
              foreach ($map["entries"] as $e) {
                if (($e["kind"] ?? "") !== "rename" || ($e["old"] ?? null) === null) continue;
                if (($e["new"] ?? null) === $argv[1]) $matches[] = $e["old"];
              }
              if (count($matches) > 1) {
                fwrite(STDERR, "old_slug_for: " . count($matches) . " rename entries claim new slug {$argv[1]} (" . implode(", ", $matches) . ") — refusing to guess\n");
                exit(1);
              }
              echo $matches[0] ?? "";
            ' "$1"
          }

          force_all="$FORCE_ALL"
          libs_str="$AFFECTED_LIBS"

          if [ "$force_all" = "yes" ]; then
            # Monorepo-wide change: push all libs
            echo "force_all=yes — pushing all libs"
            mapfile -t libs < <(php scripts/affected-libs.php --all 2>/dev/null | python3 -c "import json,sys; print('\n'.join(json.load(sys.stdin)['all_libs']))")
            # An empty force-all list means affected-libs.php (or php) failed — a
            # process-sub failure can't trip `set -e`, so fail loudly here rather
            # than silently "syncing" zero libs and reporting success.
            if [ "${#libs[@]}" -eq 0 ]; then
              echo "force_all but lib list is empty — affected-libs.php --all produced nothing" >&2
              exit 1
            fi
          else
            # Changed-only: push only affected libs
            echo "Pushing affected libs:"
            echo "$libs_str"
            read -r -a libs <<<"$libs_str"
          fi

          for lib in "${libs[@]}"; do
            [ -d "$lib" ] || { echo "skip $lib (no dir)"; continue; }
            # splitsh-lite prints the split-commit SHA for the prefix on stdout.
            sha=$(/tmp/splitsh-lite --prefix="$lib")
            push_url="https://x-access-token:$TOKEN@github.com/sugarcraft/$lib.git"

            # Rename continuity (step 2.1 verdict NOT-CONTINUOUS fallback):
            # when this dir was produced by a `git mv <old> <new>`, the split
            # above has a fresh unrelated root, so the remote master still
            # holds the only copy of the pre-rename split history. Preserve it
            # as refs/heads/legacy/<old> + refs/tags/<old>-final before the
            # first force-push that would strand it. Non-renamed libs split as
            # a fast-forward, so the ancestor guard never fires for them and
            # their split/force-push behavior is identical (every lib does pay
            # one extra local old_slug_for lookup per run — no extra network
            # calls unless the dir is a rename target). An ls-remote or fetch
            # failure aborts the job here (set -e + pipefail; note there is
            # deliberately no `|| true` on ls-remote: a truly empty repo
            # answers rc=0/empty, so a non-zero exit is an auth/network error
            # that must NOT masquerade as "nothing to preserve") — fail closed,
            # never force-push over an uninspected remote master.
            # Chained renames (A->B->C): the lookup is immediate-predecessor
            # only, so if both hops land before any intervening sync the A-era
            # remote chain is preserved as legacy/B — history survives by
            # reference; the ref name marks the hop, not the era.
            prev=$(old_slug_for "$lib")
            if [ -n "$prev" ]; then
              remote_tip=$(git ls-remote "$push_url" refs/heads/master | cut -f1)
              if [ -n "$remote_tip" ]; then
                git fetch --quiet "$push_url" "$remote_tip"
                if ! git merge-base --is-ancestor "$remote_tip" "$sha"; then
                  echo "! $lib: pre-rename master $remote_tip is not an ancestor of $sha — preserving legacy/$prev"
                  retry_git_push git push "$push_url" "$remote_tip:refs/heads/legacy/$prev"
                  retry_git_push git push "$push_url" "$remote_tip:refs/tags/$prev-final"
                fi
              fi
            fi

            retry_git_push git push --force "$push_url" "$sha:refs/heads/master"
            echo "✓ synced $lib ($sha)"

            # Belt-and-suspenders Packagist re-crawl (see env note above).
            # Guarded on the token so a fork/secret-less run skips it cleanly;
            # the `|| true` keeps a transient Packagist hiccup from failing the
            # whole sync (the per-repo webhook is still the primary path).
            if [ -n "${PACKAGIST_TOKEN:-}" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -XPOST \
                -H 'content-type: application/json' \
                "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
                -d "{\"repository\":{\"url\":\"https://github.com/sugarcraft/$lib\"}}" || echo "000")
              echo "  ↳ packagist update $lib → HTTP $code"
            fi
          done
          echo "Done — ${#libs[@]} libs pushed"

  sync-site:
    name: Push docs/ to sugarcraft/sugarcraft.github.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Mirror docs/ → sugarcraft.github.io master
        env:
          TOKEN: ${{ secrets.SUGARCRAFT_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          # Retry function for git push operations with exponential backoff
          retry_git_push() {
            local max_attempts=3
            local delay=5
            local attempt=1
            while (( attempt <= max_attempts )); do
              if "$@"; then
                return 0
              fi
              echo "Push failed (attempt $attempt/$max_attempts), waiting ${delay}s..." >&2
              sleep $delay
              ((attempt++))
              delay=$((delay * 2))
            done
            echo "Push failed after $max_attempts attempts" >&2
            return 1
          }

          tmp=$(mktemp -d)
          git clone --quiet \
            "https://x-access-token:$TOKEN@github.com/sugarcraft/sugarcraft.github.io.git" \
            "$tmp/site"
          rsync -a --delete --exclude=.git ./docs/ "$tmp/site/"
          cd "$tmp/site"
          git config user.name  'Joe Huss'
          git config user.email 'detain@interserver.net'
          git add -A
          if git diff --cached --quiet; then
            echo "site already in sync"
            exit 0
          fi
          git commit --quiet -m "Sync from monorepo @ ${GITHUB_SHA:0:7}"
          retry_git_push git push --quiet origin master
          echo "✓ pushed site update"
