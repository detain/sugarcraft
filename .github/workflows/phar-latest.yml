# Rolling LATEST phars for every phar-capable app in the monorepo.
#
# Each app gets a permanent, wget-able channel:
#   https://github.com/detain/sugarcraft/releases/download/<app>/latest/<app>.phar
#   https://github.com/detain/sugarcraft/releases/download/<app>/latest/<app>.phar.sha256
#   https://github.com/detain/sugarcraft/releases/download/<app>/latest/<app>.phar.sha256.sig      (when signed)
#   https://github.com/detain/sugarcraft/releases/download/<app>/latest/<app>.phar.minisig         (when signed)
#   https://github.com/detain/sugarcraft/releases/download/<app>/latest/<app>.phar.minisig.sha256  (when signed)
#   https://github.com/detain/sugarcraft/releases/download/<app>/latest/<app>.phar.commit          (tested SHA, OD-8)
#   https://github.com/detain/sugarcraft/releases/download/<app>/latest/<app>.phar.pins.json       (sibling pin map, OD-14)
#
# The phar-capable set is FILESYSTEM-DRIVEN: an app is built iff it appears
# in the affected set of scripts/affected-libs.php AND carries a
# <app>/tools/build-phar.php. Adding build plumbing to another app (the
# PHD/PHE/PHF waves) needs no edit to this file. candy-code and candy-top are
# built HERE for the latest channel; their versioned releases stay owned by the
# dedicated release-phar.yml / release-candy-top-phar.yml pipelines.
#
# VERSION STAMP LAW (pinned by the self-update latest-channel gates shipped by PHA/PHB):
# every archive here is stamped --version="dev-<SHORT_SHA>" (7 hex). The
# `dev-` prefix is what classifies the build as development for the
# self-update comparators; the SHORT_SHA is what makes it LOCATABLE — an
# update can tell exactly which commit it hands you. build-phar.php's
# fallback stamp `dev-build` also classifies as dev but names no commit, so
# this workflow never publishes it: the --version flag is always explicit,
# and a fail-closed step below asserts the archive's own metadata carries
# exactly `dev-<SHORT_SHA>` (the stamp self-update reads back via
# Version::fromPharMetadata — metadata truth, independent of whether the
# app's CLI happens to surface it).
#
# RELEASE POSTURE (OD-7 + OD-14 pinning, reviews-1103 G6-P; WF-CURE gate
# redesign 2026-11-13): nothing here publishes on an untested SHA, by
# construction rather than by waiting. The workflow is TRIGGERED by the CI
# workflow's own completion (`workflow_run`, conclusion success, push to
# master) and builds exactly `workflow_run.head_sha` — the commit CI blessed.
# Red or cancelled CI never starts a run (job-level filter), so the channel
# cannot publish while CI is red and no runner burns hours polling for a
# verdict that never comes (the old push-trigger + 240-minute ci-gate poll
# parked every queued run behind a red CI). A workflow_run run executes the
# DEFAULT-BRANCH copy of this file with github.sha = master's tip, not the
# tested commit, so every step reads the tested SHA from the detect job's
# `sha` output and never from github.sha. workflow_dispatch stays for the
# owner and re-checks the CI verdict at the dispatched SHA once (no poll).
# Which apps rebuild is decided per app from the published channel itself:
# the range is the app's own `<app>/latest` tag (always the tested SHA it was
# last published at) to the tested head, so commits whose CI was red in
# between are still covered by the next green run, and a late-finishing
# older CI run never moves a channel backwards. Siblings are
# pinned too: composer.json's sugarcraft/* requires are transiently resolved
# against the SAME checkout by scripts/pin-siblings.php (symlink:false path
# repositories, so vendor carries real bytes and build-phar's linked-mode
# refusal law still passes), and a post-install verify aborts the build if
# any sibling floated to the network. The committed manifests keep the
# documented @dev doctrine untouched (tools/check-path-repos.php
# --no-lib-path-repos stays green on the tree). Each archive ships a
# .phar.commit sidecar (the exact tested SHA it was built from) and a
# .phar.pins.json provenance map as release assets, so a downloaded latest phar
# is traceable to bytes CI actually tested instead of a moving dev-master.
#
# GITHUB_TOKEN pushes do not trigger other workflows, and this file
# deliberately chains nothing: the <app>/latest tag pushes below exist only to
# anchor the rolling release, never to kick off release-app-phar.yml (whose
# `candy-*/v*` filter could not match `latest` anyway).
name: Latest PHARs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      all:
        description: 'Rebuild every phar-capable app (not just the affected ones)'
        type: boolean
        default: false

# Serialize the whole stream: publishes force-move shared <app>/latest tags and
# clobber shared release assets, so two concurrent runs racing on the same
# app could interleave a tag with another run's release edit. Queued (not
# cancelled) rebuilds are the honest semantics for a rolling channel.
concurrency:
  group: phar-latest
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Same reason as ci.yml: a detached checkout versions each lib as
  # dev-<sha>; circular sibling back-requires on dev-master then fail
  # install. Pinning the root version keeps every lib-under-test dev-master.
  COMPOSER_ROOT_VERSION: dev-master

jobs:
  detect:
    # The CI-green door (OD-7), enforced at the trigger: a workflow_run run
    # exists only for a push to master whose CI run concluded success in THIS
    # repository (a fork's head_repository can never match). Dispatch is the
    # other entry and is re-verified in the resolve step below.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ci_green: ${{ steps.resolve.outputs.ci_green }}
      matrix: ${{ steps.select.outputs.matrix }}
      matrix_count: ${{ steps.select.outputs.matrix_count }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # The tested commit, not the default-branch tip a workflow_run run
          # would otherwise check out. Full history + tags: the per-app range
          # diff needs both endpoints on disk.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          coverage: none

      - name: Resolve the tested SHA and prove its CI verdict (OD-7)
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DISPATCH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: detain/sugarcraft
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            sha="$WR_SHA"
            # Belt and braces over the job-level filter.
            if [ "$WR_CONCLUSION" != "success" ]; then
              echo "refusing build: CI at $sha concluded '$WR_CONCLUSION'" >&2
              exit 1
            fi
          else
            sha="$DISPATCH_SHA"
            # One-shot verdict read, no poll: a dispatch is a deliberate act
            # on a commit that either has a green CI run or does not.
            run_line="$(gh run list --workflow CI --branch master --commit "$sha" \
              --limit 5 --json status,conclusion \
              --jq '[.[] | select(.status == "completed")] | if length == 0 then "PENDING" else (first(.[]) | .conclusion) end')"
            if [ "$run_line" != "success" ]; then
              echo "refusing build: CI at $sha concluded '$run_line'" >&2
              exit 1
            fi
          fi
          # Only master history is publishable (a re-run of an old PR-merge
          # commit is still an ancestor; a stray branch commit is not).
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "refusing build: $sha is not on master" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$sha"
          echo "CI is green at $sha - building that commit"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ci_green=true" >> "$GITHUB_OUTPUT"

      - name: Select phar-capable affected apps
        id: select
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          DISPATCH_ALL: ${{ github.event.inputs.all }}
        run: |
          set -euo pipefail
          # Candidates: every dir carrying build-phar. Each is judged against
          # its OWN published channel: no <app>/latest yet (or an unrelated
          # history) -> build; channel already at or past the tested SHA ->
          # skip (never move a channel backwards); else build iff the app is
          # in the affected closure of <app>/latest..SHA.
          git fetch --quiet --tags --force origin
          APPS=()
          for dir in */; do
            lib="${dir%/}"
            [ -f "$lib/tools/build-phar.php" ] || continue
            if [ "${DISPATCH_ALL:-false}" = "true" ]; then
              APPS+=("$lib"); continue
            fi
            if ! base="$(git rev-parse --verify --quiet "refs/tags/$lib/latest^{commit}")"; then
              echo "$lib: no published latest - building" >&2
              APPS+=("$lib"); continue
            fi
            if git merge-base --is-ancestor "$SHA" "$base"; then
              echo "$lib: channel already at or past $SHA - skipping" >&2
              continue
            fi
            if ! git merge-base --is-ancestor "$base" "$SHA"; then
              echo "$lib: published latest is not an ancestor of $SHA - rebuilding" >&2
              APPS+=("$lib"); continue
            fi
            JSON="$(php scripts/affected-libs.php --range "$base..$SHA")"
            if echo "$JSON" | jq -e --arg l "$lib" 'if .force_all then true else (.affected | index($l)) != null end' >/dev/null; then
              APPS+=("$lib")
            else
              echo "$lib: unaffected since $base" >&2
            fi
          done

          COUNT=${#APPS[@]}
          if [ "$COUNT" -eq 0 ]; then
            echo "No phar-capable app needs a rebuild - nothing to build."
            # Empty matrix DIMENSIONS are a hard job-setup error; the
            # `{include: []}` shape collapses to zero cells cleanly, and the
            # build job is additionally gated on matrix_count != '0' below
            # (the ci.yml law for docs-only pushes).
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "matrix_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # jq -s is load-bearing: without slurp, `{app: .}` is re-emitted as
          # one JSON document per input line and the output collapses into
          # garbage (the harness caught exactly this).
          MATRIX=$(printf '%s\n' "${APPS[@]}" | jq -R . | jq -cs '{app: .}')
          echo "phar matrix ($COUNT): $MATRIX" >&2
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "matrix_count=$COUNT" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    # A job-level custom `if` is evaluated with the same needs context, so the
    # condition itself names the door's verdict (G6-P MAJOR-1 lineage): no
    # CI-green resolution from detect, no build. matrix_count 0 skips quietly.
    if: needs.detect.result == 'success' && needs.detect.outputs.ci_green == 'true' && needs.detect.outputs.matrix_count != '0'
    runs-on: ubuntu-latest
    strategy:
      # One app's broken build must not cancel its siblings' publishes.
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # The tested commit (detect's resolved sha), never github.sha:
          # under workflow_run that is master's tip, which may be newer than
          # what CI blessed.
          ref: ${{ needs.detect.outputs.sha }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          coverage: none
          # The full ci.yml extension union, not either app's slimmer
          # release-pipeline list: this job builds an open-ended fleet of
          # apps, so every extension any of them may composer-resolve has to
          # be present. Over-install is cheap on ubuntu-latest; a missing one
          # is a red matrix cell.
          extensions: mbstring, intl, json, pcntl, sqlite3, pdo_sqlite, pdo_mysql, pdo_pgsql, ssh2, gd, curl, openssl, ffi

      - name: Pin sibling deps to the pushed commit (OD-14)
        # Transient rewrite of the app manifest's sugarcraft/* requires into
        # symlink:false path repositories over THIS checkout, plus a
        # sibling-pins.json sidecar naming every resolved sibling. The
        # committed tree never carries this mutation (it lives only in the
        # runner's copy), so the path-repos inverse policy stays green.
        # WF-CURE (#60/#68 lineage): the sidecar is born OUTSIDE the worktree
        # via --out — a repo-root relocation would itself show up as an
        # untracked path in build-phar Guard 2's repo-wide porcelain.
        env:
          APP: ${{ matrix.app }}
          SHA: ${{ needs.detect.outputs.sha }}
        run: |
          set -euo pipefail
          php scripts/pin-siblings.php inject "$APP" --root . --sha "$SHA" \
            --out "${RUNNER_TEMP:-/tmp}/pins-$APP.json"

      - name: Install production dependencies
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          cd "$APP"
          # Linked-mode local checkouts can carry a path-repo lock; CI starts
          # from git, and build-phar REFUSES symlinked sibling vendors as the
          # second line of defence against frozen sibling WIP. The injected
          # sibling repositories above are symlink:false for exactly this
          # reason: vendor ends up holding real copies of the tested bytes.
          rm -f composer.lock
          composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Verify no sibling floated to the network (OD-14)
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          php scripts/pin-siblings.php verify "$APP"
          # WF-CURE: no sidecar mv here — inject already parked it outside
          # the worktree (--out, RUNNER_TEMP); verify reads only the lock.

      - name: Restore app manifest + prove Guard 2 preconditions (WF-CURE)
        # OD-14's inject rewrites the tracked $APP/composer.json, and build-phar
        # Guard 2's porcelain is REPO-WIDE (`git -C $APP status --porcelain`
        # reports every path of the monorepo), so the injected manifest froze
        # the whole latest-channel fleet from 2026-11-04 on. The injection has done its
        # job by now — vendor holds the pinned bytes and build-phar reads
        # vendor/composer/installed.json, never the manifest — so restore it,
        # then prove Guard 2's exact precondition at the seat: the tripwire
        # runs the same repo-wide porcelain, so a red names the lingering path
        # here instead of a bare exit 2 from inside the build. The guard
        # itself stays untouched (ceiling-silence law).
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          git checkout -- "$APP/composer.json"
          dirty="$(git -C "$APP" status --porcelain)"
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty"
            echo "::error::tree still dirty for Guard 2 after manifest restore (repo-wide porcelain via -C $APP)"
            exit 1
          fi

      - name: Build the archive
        id: build
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          app="$APP"
          short="$(git rev-parse --short=7 HEAD)"
          # SOURCE_DATE_EPOCH pins metadata['built_at'] to the commit date
          # (the same DST-1 discipline as the release pipelines); the
          # sibling bytes are the pinned ones the verify step above just
          # vouched for, so the whole archive is reproducible from HEAD.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%cT HEAD)"
          php -d phar.readonly=0 "$app/tools/build-phar.php" \
            --out="dist/$app.phar" \
            --version="dev-$short"
          echo "short=$short" >> "$GITHUB_OUTPUT"

      - name: Provenance sidecars (OD-8)
        # The rolling channel's answer to "which commit am I holding?":
        # .phar.commit names the full tested SHA the archive was built at
        # (the CI-gated one), .phar.pins.json maps every sugarcraft/*
        # sibling to those same bytes. Assets, not archive contents — the
        # stamp inside the archive stays the dev-<short7> metadata.
        env:
          APP: ${{ matrix.app }}
          SHA: ${{ needs.detect.outputs.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SHA" > "dist/$APP.phar.commit"
          mv "${RUNNER_TEMP:-/tmp}/pins-$APP.json" "dist/$APP.phar.pins.json"
          test -s "dist/$APP.phar.commit"
          test -s "dist/$APP.phar.pins.json"

      - name: Assert the dev stamp is locatable in the archive metadata
        # Fail-closed locator gate: the release channel is only trustworthy
        # if the archive itself says which commit it is. This reads the
        # manifest metadata — the exact value self-update recovers via
        # Version::fromPharMetadata — so the assertion is about the artifact,
        # not about whether the app's CLI happens to print it.
        run: |
          set -euo pipefail
          want="$WANT_STAMP"
          php -r '
            $phar = getenv("PHAR_PATH");
            $want = getenv("WANT_STAMP");
            $meta = (new Phar($phar))->getMetadata();
            $got = is_array($meta) ? ($meta["version"] ?? null) : null;
            if ($got !== $want) {
              fwrite(STDERR, "dev stamp mismatch: metadata has " . var_export($got, true) . ", expected " . $want . "\n");
              exit(1);
            }
          '
        env:
          PHAR_PATH: ${{ github.workspace }}/dist/${{ matrix.app }}.phar
          WANT_STAMP: dev-${{ steps.build.outputs.short }}

      - name: Checksum
        # C-SES-5.c: runs BEFORE signing on purpose — the signing step's
        # headline artifact is a signature over this sidecar's body, so the
        # sidecar has to exist first. The .sha256 names the bytes this job
        # built (integrity); the trust leg is the signature below.
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          app="$APP"
          (cd dist && sha256sum "$app.phar" > "$app.phar.sha256")
          cat "dist/$app.phar.sha256"

      - name: Sign the archive (pinned-key mode)
        # OPTIONAL by design (identical semantics to the release pipelines):
        # without SUGARCRAFT_SIGNING_KEY the step skips green and the latest
        # channel ships unsigned. When the owner populates the sugarcraft-wide
        # secret, every app's phar carries — verified by each app against the
        # public half pinned in its own source:
        #   - $app.phar.sha256.sig: a base64 detached sodium signature over
        #     the .sha256 SIDECAR BODY (a few bytes, never the whole archive);
        #     the leg current candy-code `self-update` verifies (C-SES-5.b).
        #   - $app.phar.minisig: the legacy raw-byte signature, kept
        #     additively for candy-top and older candy-code releases.
        #   - $app.phar.minisig.sha256: computed here, not in the (now
        #     earlier) checksum step, since it can only exist after its file.
        # In keyless state all three are skipped together: one early-exit step.
        run: |
          set -euo pipefail
          app="$APP"
          if [ -z "${SUGARCRAFT_SIGNING_KEY:-}" ]; then
            echo "::notice::SUGARCRAFT_SIGNING_KEY secret not set — shipping unsigned (keyless state)"
            exit 0
          fi
          php -r '
            $app = getenv("APP");
            $key = base64_decode(getenv("SUGARCRAFT_SIGNING_KEY"), true);
            if ($key === false || strlen($key) !== SODIUM_CRYPTO_SIGN_SECRETKEYBYTES) {
              fwrite(STDERR, "SUGARCRAFT_SIGNING_KEY must be the base64 of the 64-byte sodium secret key\n");
              exit(1);
            }
            $sig = sodium_crypto_sign_detached(file_get_contents("dist/$app.phar"), $key);
            file_put_contents("dist/$app.phar.minisig", base64_encode($sig) . "\n");
            $sidecar_sig = sodium_crypto_sign_detached(file_get_contents("dist/$app.phar.sha256"), $key);
            file_put_contents("dist/$app.phar.sha256.sig", base64_encode($sidecar_sig) . "\n");
          '
          (cd dist && sha256sum "$app.phar.minisig" > "$app.phar.minisig.sha256")
        env:
          APP: ${{ matrix.app }}
          SUGARCRAFT_SIGNING_KEY: ${{ secrets.SUGARCRAFT_SIGNING_KEY }}

      - name: Smoke — the archive runs
        # Honest, app-agnostic shape: --version must succeed and print
        # something on a virgin HOME, and --help must render. Which of those
        # answers carries the dev stamp varies by app: those with a
        # Version::fromPharMetadata arm (candy-code, candy-top,
        # candy-gifview, …) read their phar metadata back into --version,
        # while apps without that arm print their frozen composer version.
        # The stamp gate
        # above asserted metadata truth for EVERY app, so this step never
        # pretends: a missing CLI echo is a ::notice:: naming the gap, not a
        # pass-by-omission.
        run: |
          set -euo pipefail
          app="$APP"
          stamp="$STEP_STAMP"
          fake_home="$(mktemp -d)"
          out="$(HOME="$fake_home" php "dist/$app.phar" --version)"
          test -n "$out"
          echo "--version says: $out"
          if printf '%s' "$out" | grep -qF "$stamp"; then
            echo "CLI echoes the dev stamp"
          else
            echo "::notice::$app --version does not surface the phar metadata stamp (archive metadata still carries $stamp)"
          fi
          HOME="$fake_home" php "dist/$app.phar" --help >/dev/null
          if [ "$app" = "candy-tetris" ]; then
            # no raw app i18n key may leak into the rendered help (step-18 leg)
            help_out="$(HOME="$fake_home" php "dist/$app.phar" --help)"
            if printf '%s' "$help_out" | grep -q 'tetris\.'; then
              echo "::error::$app --help renders a raw tetris.* i18n key"
              exit 1
            fi
          fi
        env:
          APP: ${{ matrix.app }}
          STEP_STAMP: dev-${{ steps.build.outputs.short }}

      - name: Publish rolling latest release
        # CRITICAL: --target with the explicit commit SHA on BOTH branches.
        # A GITHUB_TOKEN-created release defaults target_commitish to the
        # default BRANCH NAME; the self-update latest-channel gates (PHA/PHB) fail
        # closed on exactly that shape, and gh release create after a
        # force-moved tag can otherwise keep a stale target from the old
        # release object — hence `gh release edit --target` on the
        # already-exists path too, never skipped.
        run: |
          set -euo pipefail
          app="$APP"
          stamp="$STEP_STAMP"
          git tag -f "$app/latest" "$GITHUB_SHA"
          git push -f origin "refs/tags/$app/latest"
          assets=("dist/$app.phar" "dist/$app.phar.sha256" "dist/$app.phar.commit" "dist/$app.phar.pins.json")
          if [ -f "dist/$app.phar.minisig" ]; then
            assets+=("dist/$app.phar.minisig" "dist/$app.phar.minisig.sha256" "dist/$app.phar.sha256.sig")
            signed="Signed with the sugarcraft-wide key (verify the chain: check $app.phar.sha256.sig — a sodium detached signature over the sidecar body — against the public half pinned in the self-update apps' source (candy-code and candy-top — the only apps that pin the key), then sha256sum -c $app.phar.sha256 on the archive; the legacy raw-byte $app.phar.minisig rides along for older clients, and a plain sha256sum -c of it would prove integrity only, never authenticity)."
          else
            signed="Unsigned in this build (no SUGARCRAFT_SIGNING_KEY on the runner at build time)."
          fi
          notes="Rolling development PHAR for $app at ${stamp}. Rebuilt by .github/workflows/phar-latest.yml whenever a CI-green change touches the app (triggered by that commit's own green CI run, or workflow_dispatch with 'all'). This archive carries the locatable stamp dev-${GITHUB_SHA::7} in its manifest metadata, and the .phar.commit sidecar names the full tested SHA. ${signed} Not a stable channel — the bytes move with every CI-green master merge."
          if gh release view "$app/latest" >/dev/null 2>&1; then
            gh release upload "$app/latest" "${assets[@]}" --clobber
            gh release edit "$app/latest" --target "$GITHUB_SHA" --title "$app latest ${stamp#dev-}" --notes "$(printf '%b' "$notes")"
          else
            gh release create "$app/latest" "${assets[@]}" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$app latest ${stamp#dev-}" \
              --notes "$(printf '%b' "$notes")"
          fi
        env:
          APP: ${{ matrix.app }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ needs.detect.outputs.sha }}
          STEP_STAMP: dev-${{ steps.build.outputs.short }}
