name: web

# Node CI for sugar-crush-web, the Vite + Vue 3 browser UI. The PHP shim and
# its AssetsTest run in ci.yml like every other lib (scripts/affected-libs.php
# discovers sugar-crush-web through composer.json + phpunit.xml); this
# workflow owns the TypeScript side and the committed bundle.
#
# THE LOAD-BEARING STEP is the dist/ diff. `dist/` is committed so PHP users
# get the UI from `composer require` without Node, which makes it a generated
# artifact in the tree, like docs/lib/*.html: a source edit without a rebuild,
# or a hand-edit to the bundle, must go red here rather than ship.
#
# THE SECOND GENERATED ARTIFACT is src-web/protocol/generated.ts: the
# client's types are generated from sugar-crush's protocol schema
# (sugar-crush/docs/protocol/sugarcrush.v1.schema.json, itself generated from
# the PHP value objects). A server change that the client was not regenerated
# for goes red here, at the diff after `npm run gen:protocol`, before it can
# become a runtime surprise.
#
# Path-scoped on purpose — not in affected-libs.php's FORCE_ALL_FILES.

on:
  push:
    branches: [master]
    paths:
      - 'sugar-crush-web/**'
      - 'sugar-crush/docs/protocol/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'sugar-crush-web/**'
      - 'sugar-crush/docs/protocol/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'sugar-crush-web · lint, typecheck, test, dist parity'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sugar-crush-web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: sugar-crush-web/.nvmrc
          cache: npm
          cache-dependency-path: sugar-crush-web/package-lock.json

      - name: Install (lockfile only)
        run: npm ci

      - name: Protocol types match the server schema
        run: |
          npm run gen:protocol
          if ! git diff --exit-code -- src-web/protocol/generated.ts; then
            echo "::error::sugar-crush-web/src-web/protocol/generated.ts is stale. Run 'npm run gen:protocol' in sugar-crush-web/ and commit it."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Both halves matter: `git diff` catches a changed or deleted committed
      # file, and the porcelain check catches a NEW emitted file (a renamed
      # content-hashed chunk) that was never committed.
      - name: Committed dist/ matches the source
        run: |
          if ! git diff --exit-code -- dist/ || [ -n "$(git status --porcelain -- dist/)" ]; then
            git status --short -- dist/
            echo "::error::sugar-crush-web/dist/ is stale. Run 'npm ci && npm run build' in sugar-crush-web/ and commit dist/ with the source change."
            exit 1
          fi
          echo "OK: dist/ is byte-identical to a clean build of src-web/"
