# fix-wave — fan a parameterized file list over parallel coder shards, then summarize.
#
# Loadable directly via SugarCraft\Code\Workflows\WorkflowRegistry:
#
#   $registry = new WorkflowRegistry(__DIR__ . '/examples/workflows');
#   $workflow = $registry->loadYaml('fix-wave');
#   (new WorkflowEngine($registry, $pool))->run('fix-wave', [
#       'files' => 'src/A.php,src/B.php,src/C.php',
#       'spec'  => 'docs/briefs/migration.md',
#   ]);
#
# Or drop a copy in ~/.candy-code/workflows/fix-wave.yaml (the default
# WorkflowRegistry lookup path) and run it via the /workflow command inside
# the chat TUI: `/workflow run fix-wave files=src/A.php,src/B.php spec=docs/briefs/migration.md`.
#
# Parameters (run-context values are whitespace-split, so no value may
# contain a space — the file list is comma-separated for that reason, and
# the prose of the job lives in a spec FILE every shard Reads):
#   - files: comma-separated work list (src/A.php,src/B.php,...).
#   - spec:  path to the written brief describing the fix to apply.
#
# Schema notes (see src/Workflows/WorkflowRegistry.php::parseYamlWorkflow):
#   - top-level "name" is required; "description" and "config" are optional.
#   - each item in "stages" is either a regular stage (agent/prompt/tools)
#     or a parallel stage (parallel: true + a list of "agents").
#   - {{var}} interpolates initial run() context; {{stageName.output}}
#     interpolates a prior stage's collected output.
#   - config.maxConcurrent bounds how many parallel-stage agents run at
#     once; config.timeout is each stage's wall-clock budget in seconds —
#     there is no per-file or per-task timeout spelling in YAML.
#   - "retries" re-runs a failed agent inside the stage budget; it goes only
#     on agents that are safe to run twice. The shards edit files, so they
#     carry none; "summarize" is read-only, so it carries one.
#
# Expressible-only notes (what today's YAML cannot say):
#   - The shard count is fixed at write-time; it cannot be generated from
#     {{files}} (no dynamic fan-out). Three static shards therefore split the
#     list by position: every 3rd entry starting at 1/2/3 covers it exactly.
#   - Each shard's outputSchema result comes back as TEXT inside
#     {{wave.output}}; summarize re-reads it, but YAML cannot treat it as
#     data (no filtering, counting, or merging of fields).
#   - There is no when:/skip clause: the run cannot branch on a shard's
#     result, and cannot stop early when every file is already clean.
#   - The shards edit the SHARED checkout — safe only because their file
#     sets are disjoint by list position. Set `isolation: worktree` on each
#     shard to keep each one in its own branch instead, but NOTHING merges
#     isolated trees automatically: each shard's output names its tree and
#     branch for a hand merge, which is usually worse than this partitioned
#     shared-checkout shape. See docs/WORKFLOWS.md.

name: fix-wave
description: >
  Split a comma-separated file list across three parallel coder shards that
  apply the fix described in a spec file, then have an empty-tools reviewer
  fold the shard reports into one schema-shaped summary.

stages:
  - name: wave
    parallel: true
    agents:
      - name: shard-one
        type: coder
        prompt: >
          Read the job brief at {{spec}}. The work list is {{files}} —
          treat it as a comma-separated list and handle every 3rd entry
          starting at the FIRST entry (positions 1, 4, 7, ...). Two other
          agents are handling the remaining positions, so touch no file
          outside your share. Apply the brief's fix to each of your files;
          if one needs no change, list it as skipped rather than editing it.
        tools: [Read, Edit, Grep, Glob]
        outputSchema:
          type: object
          properties:
            changed:
              type: array
              items:
                type: string
            skipped:
              type: array
              items:
                type: string
            notes:
              type: string
          required: [changed, skipped, notes]

      - name: shard-two
        type: coder
        prompt: >
          Read the job brief at {{spec}}. The work list is {{files}} —
          treat it as a comma-separated list and handle every 3rd entry
          starting at the SECOND entry (positions 2, 5, 8, ...). Two other
          agents are handling the remaining positions, so touch no file
          outside your share. Apply the brief's fix to each of your files;
          if one needs no change, list it as skipped rather than editing it.
        tools: [Read, Edit, Grep, Glob]
        outputSchema:
          type: object
          properties:
            changed:
              type: array
              items:
                type: string
            skipped:
              type: array
              items:
                type: string
            notes:
              type: string
          required: [changed, skipped, notes]

      - name: shard-three
        type: coder
        prompt: >
          Read the job brief at {{spec}}. The work list is {{files}} —
          treat it as a comma-separated list and handle every 3rd entry
          starting at the THIRD entry (positions 3, 6, 9, ...). Two other
          agents are handling the remaining positions, so touch no file
          outside your share. Apply the brief's fix to each of your files;
          if one needs no change, list it as skipped rather than editing it.
        tools: [Read, Edit, Grep, Glob]
        outputSchema:
          type: object
          properties:
            changed:
              type: array
              items:
                type: string
            skipped:
              type: array
              items:
                type: string
            notes:
              type: string
          required: [changed, skipped, notes]

  - name: summarize
    agent: reviewer
    prompt: >
      The parallel stage above reported each shard's changed and skipped
      files as JSON blobs: {{wave.output}}. Merge the three shard reports
      into one summary — total files changed, files skipped, and any risks
      or inconsistencies you spot between the shards. Do not edit anything:
      this stage has no tools at all.
    tools: []
    retries: 1
    outputSchema:
      type: object
      properties:
        summary:
          type: string
        totalChanged:
          type: integer
        risks:
          type: array
          items:
            type: string
      required: [summary, totalChanged, risks]

config:
  maxConcurrent: 3
  timeout: 1800
