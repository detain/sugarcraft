# fix-wave — apply one written fix to every file in a list, one agent per
# file in parallel, then fold the per-file reports into one summary.
#
# Pattern: data fan-out over a run-context LIST (from: {context: files}),
# with minSuccess so one bad file does not throw away the rest. See the
# workflow-authoring skill, "Quality patterns".
#
# Parameters:
#   - files: a JSON LIST of paths, e.g. ["src/A.php", "src/B.php"]. Pass it
#            with := (the value is parsed as JSON); a plain files=... is a
#            STRING, and the stage fails before dispatching anything
#            ("... from context 'files', which is a string, not an array").
#   - spec:  path to the brief describing the fix. The job's prose lives in
#            that FILE so every agent reads the same text.
#
# Run it:
#   /workflow run fix-wave files:='["src/A.php","src/B.php"]' spec=docs/brief.md
#   candy-code workflow run fix-wave --param files:='["src/A.php","src/B.php"]' --param spec=docs/brief.md
#   Workflow tool (context takes real JSON, so the list goes in as a list):
#     {"plan": "<this file's YAML>",
#      "context": {"files": ["src/A.php", "src/B.php"], "spec": "docs/brief.md"}}
#   PHP: $engine->run('fix-wave', ['files' => ['src/A.php', 'src/B.php'], 'spec' => 'docs/brief.md']);
#   key:=<json> is the typed spelling on both command lines; single-quote
#   the JSON so its own double quotes survive.
#
# How it works:
#   - "wave" fans out one agent per list entry. key: "" (the whole item is
#     its own identity) dedups the list, so no two agents ever edit the same
#     file, and names each agent wave_<file>. The agents edit the shared
#     checkout; that is safe only because their files are disjoint. (The
#     linter still warns about shared-checkout writers; read it, then decide.)
#   - Each agent answers a typed report (outputSchema $ref: report),
#     enforced: the agent must end with a valid StructuredOutput call.
#   - minSuccess: 90% completes the wave when at least 90% of the files
#     succeeded (rounded up). The casualties are listed in the stage output
#     and as {{wave.failed}}, and the engine always announces them.
#   - The fixers carry no retries: a re-run would start from a file the
#     failed attempt may already have edited. "summarize" only reads, so it
#     retries once.
#   - Nothing caps the list here except the engine's 4096-item fan-out
#     ceiling; add max: N to "from" to keep the first N and record the rest
#     as dropped.

name: fix-wave
description: >
  Fan the fix described in a spec file out over a JSON list of files, one
  agent per file in parallel, tolerate a few casualties, and fold the
  per-file reports into one summary.

config:
  timeout: 1800
  maxConcurrent: 4

schemas:
  report:
    type: object
    properties:
      file: {type: string}
      changed: {type: boolean}
      notes: {type: string}
    required: [file, changed, notes]
  summary:
    type: object
    properties:
      summary: {type: string}
      totalChanged: {type: integer}
      failed:
        type: array
        items: {type: string}
      risks:
        type: array
        items: {type: string}
    required: [summary, totalChanged, failed, risks]

stages:
  - name: wave
    parallel: true
    from: {context: files, key: ""}
    minSuccess: 90%
    prompt: >
      Read the job brief at {{spec}} and apply its fix to exactly ONE file:
      {{item}}. Other agents own every other file in the list, so touch no
      file but this one. If the file needs no change, change nothing and
      say so (changed: false).
    tools: [Read, Edit, Grep, Glob]
    outputSchema: {$ref: report}

  - name: summarize
    input: {from: [wave], as: all}
    prompt: >
      Below are the per-file reports of a fix wave (one JSON report per
      file), and these files failed outright: {{wave.failed}}. Merge them
      into one summary: how many files changed, which failed, and any risks
      or inconsistencies between the reports. Edit nothing. {{input}}
    tools: [Read]
    retries: 1
    outputSchema: {$ref: summary}
