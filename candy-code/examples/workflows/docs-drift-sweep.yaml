# docs-drift-sweep — audit docs for drift, fan out a fixer per category, re-audit.
#
# Run it:
#   /workflow run docs-drift-sweep scope=docs/
#   candy-code workflow run docs-drift-sweep --param scope=docs/
#   Workflow tool: {"plan": "<this file's YAML>", "context": {"scope": "docs/"}}
#
# Parameters:
#   - scope: the docs subtree to sweep. A path with a space is quoted:
#     `/workflow run docs-drift-sweep scope="docs/user guide/"`.
#
# Schema notes (see src/Workflows/WorkflowRegistry.php::parseYamlWorkflow):
#   - top-level "name" is required; "description" and "config" are optional.
#   - the stages this file uses are regular stages (agent/prompt/tools) and
#     one parallel stage (parallel: true + a list of "agents"); WORKFLOWS.md
#     is the source of truth for every stage shape and key the grammar
#     accepts.
#   - {{var}} interpolates initial run() context; {{stageName.output}}
#     interpolates a prior stage's collected output. "recheck" reads the
#     fix reports through an "input:" join ({{input}}) instead.
#   - config.maxConcurrent bounds how many parallel-stage agents run at
#     once; config.timeout is each stage's wall-clock budget in seconds, the
#     only timeout this file sets. WORKFLOWS.md is the source of truth for
#     every timeout spelling the grammar accepts.
#   - "retries" goes only on agents that are safe to run twice: the audit
#     and recheck stages merely read, so they carry one; the fixers edit
#     files, so a second run could apply a correction twice, and they carry
#     none. The fixers are disjoint by finding category, the same partition
#     lint-then-fix.yaml uses for its style/correctness fixers.
#
# Gating notes:
#   - "fix" and "recheck" carry the same "when:" clause: they run only when
#     the audit tagged at least one line with a category. A clean audit
#     ends the run after one stage, with nothing else dispatched or billed.
#   - The sweep is ONE pass. A second pass is the driver's call: if
#     "recheck" reports clean: false, re-run the workflow. (A loop could
#     repeat it, but it would re-run the fixers on findings a round already
#     fixed; review-changes.yaml shows the accumulate-until-dry shape for
#     discovery.)
#   - "recheck" answers through outputSchema, which is enforced: the agent
#     must end with a StructuredOutput call that validates, so once it
#     completes, {{recheck.clean}} and the Workflow tool's "data" field
#     always have the schema's shape.
#   - {{audit.output}} reaches the fixers as a text blob, not data: each
#     fixer self-selects its category by reading, and this file fans out
#     one fixer per CATEGORY, not per FINDING — its agent list is written
#     in full below. For one agent per finding, give the audit an
#     outputSchema and fan out with from: {stage: audit, pointer: ...}.

name: docs-drift-sweep
description: >
  Compare documentation under the given scope against the code it
  describes, fan out a doc fixer per finding category in parallel, then
  re-audit and emit a clean/remaining verdict the driver acts on. A clean
  audit skips the fix and re-audit stages.

stages:
  - name: audit
    agent: reviewer
    prompt: >
      Audit the documentation under {{scope}} against the code it
      describes. List every drift finding as exactly one line in the form
      "readme-table | file:line | correction needed" — or
      "guide-prose | file:line | correction needed", or
      "api-doc | file:line | correction needed". Use only those three
      category tags. Report nothing that is not actual drift between doc
      and code.
    tools: [Read, Grep, Glob, Bash]
    retries: 1

  - name: fix
    parallel: true
    when:
      stage: audit
      matches: '/^(readme-table|guide-prose|api-doc) \|/m'
    agents:
      - name: readme_table_fixer
        type: coder
        prompt: >
          From the findings listed in {{audit.output}}, apply ONLY the
          "readme-table" ones — rows and tallies in README tables that
          disagree with the code. Correct each to match the code today.
          Leave guide-prose and api-doc findings alone; other agents own
          those.
        tools: [Read, Edit, Grep]

      - name: guide_prose_fixer
        type: coder
        prompt: >
          From the findings listed in {{audit.output}}, apply ONLY the
          "guide-prose" ones — sentences in guides and handbooks that
          describe behavior the code no longer has. Correct each to match
          the code today. Leave readme-table and api-doc findings alone;
          other agents own those.
        tools: [Read, Edit, Grep]

      - name: api_doc_fixer
        type: coder
        prompt: >
          From the findings listed in {{audit.output}}, apply ONLY the
          "api-doc" ones — docblocks and API reference text whose
          signatures, types, or contracts drifted from the code. Correct
          each to match the code today. Leave readme-table and guide-prose
          findings alone; other agents own those.
        tools: [Read, Edit, Grep]

  - name: recheck
    agent: reviewer
    when:
      stage: audit
      matches: '/^(readme-table|guide-prose|api-doc) \|/m'
    input:
      from: [fix]
      as: all
    prompt: >
      Re-audit {{scope}} exactly as the audit stage did, after the fixes
      reported below landed. Set clean to true only if NO
      drift findings remain in any category; otherwise list every leftover
      finding in "remaining", one per line, in the same tagged form.
      {{input}}
    tools: [Read, Grep, Glob, Bash]
    retries: 1
    outputSchema:
      type: object
      properties:
        clean:
          type: boolean
        remaining:
          type: array
          items:
            type: string
      required: [clean, remaining]

config:
  maxConcurrent: 3
  timeout: 1800
