# lint-then-fix — review a change, fan out fixers by finding category, then verify.
#
# Run it:
#   /workflow run lint-then-fix scope=src/Chat.php
#     (values may be quoted: scope="src/Some Dir/")
#   candy-code workflow run lint-then-fix --param scope=src/Chat.php
#   Workflow tool: {"plan": "<this file's YAML>", "context": {"scope": "src/Chat.php"}}
#   PHP: (new WorkflowEngine($registry, $pool))->run('lint-then-fix', ['scope' => 'src/Chat.php']);
#
# Schema notes (see src/Workflows/WorkflowRegistry.php::parseYamlWorkflow):
#   - top-level "name" is required; "description" and "config" are optional.
#   - the stages this file uses are regular stages (agent/prompt/tools) and
#     one parallel stage (parallel: true + a list of "agents"); WORKFLOWS.md
#     is the source of truth for every stage shape and key the grammar
#     accepts.
#   - {{var}} interpolates initial run() context; {{stageName.output}}
#     interpolates a prior stage's collected output. "verify" reads the
#     earlier stages through an "input:" join instead: one labelled block
#     per stage that ran, and a stage "when:" skipped is simply absent.
#   - "when:" gates the "fix" stage on the lint report: it runs only when
#     at least one line is tagged with a category a fixer owns. A clean
#     lint skips it — nothing dispatched, nothing billed — and "verify"
#     still runs the suite.
#   - config.maxConcurrent bounds how many parallel-stage agents run at
#     once; config.timeout is each stage's wall-clock budget in seconds. A
#     stage that runs past it has its agent killed (with every process the
#     agent started) and fails as timed out, which stops the run. That
#     stage-level budget is the only timeout this file sets; WORKFLOWS.md
#     is the source of truth for every timeout spelling the grammar accepts.
#   - "retries" (on a stage, or on one agent of a parallel stage) re-runs a
#     failed or timed-out agent up to that many times, inside the same stage
#     budget; the stage fails only if the last attempt does. Give it only to
#     an agent that is safe to run twice: "lint" below only reviews, while the
#     fixers edit files, so a second run could apply a finding twice. See
#     docs/WORKFLOWS.md.

name: lint-then-fix
description: >
  Review the current change for style/correctness/simplification issues,
  fan out a fixer per finding category in parallel, then run the test
  suite to confirm nothing regressed.

stages:
  - name: lint
    agent: reviewer
    prompt: >
      Review the diff at {{scope}} for style, correctness, and
      simplification issues. List each finding as exactly one line in
      the form "category | file:line | finding", where category is one
      of style, correctness, or simplification. Report nothing else on a
      line that starts with a category word.
    tools: [Read, Grep, Glob, Bash]
    retries: 1

  - name: fix
    parallel: true
    when:
      stage: lint
      matches: '/^(style|correctness) \|/m'
    agents:
      - name: style_fixer
        type: coder
        prompt: >
          Apply only the "style" findings from {{lint.output}} to their
          listed files. Leave correctness/simplification findings alone —
          another agent is handling those.
        tools: [Read, Edit, Grep]

      - name: correctness_fixer
        type: coder
        prompt: >
          Apply only the "correctness" findings from {{lint.output}} to
          their listed files. Leave style/simplification findings alone —
          another agent is handling those.
        tools: [Read, Edit, Grep, Bash]

  - name: verify
    agent: tester
    input:
      from: [lint, fix]
      as: all
    prompt: >
      Run the project's test suite and report pass/fail. Below are the
      lint report and, when fixers ran, their reports. If the fixes
      introduced any new failures relative to the lint baseline, list
      them explicitly.
      {{input}}
    tools: [Bash, Read]

config:
  maxConcurrent: 3
  timeout: 1800
