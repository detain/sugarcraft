# Per-lib Codecov configuration for candy-git
# Flag and component are defined in root codecov.yml
# This file allows lib-specific threshold overrides

coverage:
  status:
    project:
      candy-git:
        target: auto
        threshold: 1%
    patch:
      candy-git:
        target: 80%
        threshold: 1%

comment:
  layout: "header, diff, flags, components"
  require_changes: false
